[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmef-research"
version = "0.1.0"
description = "PC-MEF Research System — physics-calibrated simulation and LLM-assisted multimodal fusion for intra-pipe liquid-state identification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 分組安裝：M1 之前不需要 mitsuba，M4 之前不需要 tensorflow。
# 這讓 core/adapters/E1 統計層能在沒有重依賴的機器上完整測試。
simulation = ["mitsuba>=3.5", "drjit>=0.4"]
perception = ["tensorflow>=2.13", "scikit-learn>=1.3"]
agents = ["httpx>=0.27", "jsonschema>=4.20"]
admin = ["Flask>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pcmef = "pcmef.cli:main"

[tool.setuptools.packages.find]
include = ["pcmef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "requires_real_data: 需要前研究原始 ToF/RGB 資料才能執行（見 NOTES.md NOTE-008）",
    "requires_simulation: 需要 mitsuba/drjit",
    "requires_perception: 需要 tensorflow/scikit-learn",
    "requires_provider: 需要外部 LLM provider 憑證",
]
