[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmef-research"
version = "0.1.0"
description = "PC-MEF Research System — physics-calibrated simulation and LLM-assisted multimodal fusion for intra-pipe liquid-state identification"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# 分組安裝：M1 之前不需要 mitsuba，M4 之前不需要 torch。
# 這讓 core/adapters/E1 統計層能在沒有重依賴的機器上完整測試。
# mitsuba/drjit 刻意不釘上界：開發期跟隨上游即可。但 transient 的數值輸出會
# 餵進 E1，因此**容器內釘死在與本機相同的版本**（見 Dockerfile）——
# 兩邊跑出不同版本的話結果不可比，而 NOTE-012 / NOTE-013 是在 3.8.0 上驗證的。
simulation = ["mitsuba>=3.5", "drjit>=0.4", "mitransient>=1.3"]
# 2026-09-01（NOTE-051）：本組原本宣告 tensorflow + scikit-learn，
# 而這兩個套件**在整個程式庫裡一次都沒有被 import**。實際的 perception
# 相依是 torch（baselines.VisionCNN / ToFCNN、gate.load_frozen_models）；
# EXR 讀取走 mitsuba，其餘數值走已在核心相依的 numpy/scipy。
# 宣告錯的相依比沒宣告更糟：乾淨機器會裝兩個用不到的重套件，然後仍然缺 torch。
perception = ["torch>=2.0"]
# Pillow 是 encode_image_evidence() 的 PNG 編碼後端，也就是 vision 角色
# 送出影像的唯一路徑。2026-09-01 之前沒宣告只是因為主機碰巧裝了：
# real validation 把編碼放在主機、provider 呼叫放在容器，所以容器缺它也不會
# 顯現。Full PC-MEF 的 Formal E2 在同一個行程內做完兩件事，就會撞上。
agents = ["httpx>=0.27", "jsonschema>=4.20", "Pillow>=10.0"]
# cryptography 是 secrets vault 的加密後端。缺它時系統 fail-closed
# （只能用 env: 形式的 secret_ref，不能在 UI 直接貼 key，見 NOTE-016），
# 因此它是 admin 這組功能的真實相依，不是可有可無 ——
# 先前沒宣告只是因為本機碰巧裝了，換一台乾淨的機器就會壞。
admin = ["Flask>=3.0", "cryptography>=42.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
pcmef = "pcmef.cli:main"

[tool.setuptools.packages.find]
include = ["pcmef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "requires_real_data: 需要前研究原始 ToF/RGB 資料才能執行（見 NOTES.md NOTE-008）",
    "requires_simulation: 需要 mitsuba/drjit",
    "requires_perception: 需要 torch",
    "requires_provider: 需要外部 LLM provider 憑證",
]
