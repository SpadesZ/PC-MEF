# PC-MEF Research System source maintenance contract
# 上下游: 由 docker compose 讀取；建置 Dockerfile 定義的映像，
#         把主機的 data/ outputs/ freeze/ registry/ secrets/ provenance/
#         artifacts/ 掛進容器；console 服務對外開 127.0.0.1:8790。
# 檔案路徑: docker-compose.yml
# 產生時間: 2026-08-27 11:10 +08:00
# 版本: v0.1.0
# 功能說明: 定義兩種用法 —— 跑一次就結束的 CLI 指令（pcmef），
#           以及常駐的本機網頁主控台（console）。兩者共用同一個映像與同一批資料。
# 模組定位: 環境編排。它「不是」正式部署設定 —— 埠一律綁 127.0.0.1，
#           這套系統是 local-first 研究平台。
# 主要責任:
#   1. pcmef 服務：一次性 CLI，預設不啟動（profile: cli）
#   2. console 服務：本機網頁主控台，主機端綁 127.0.0.1:8790
#   3. 以具名 volume 保存 registry 與 secrets，避免權限與誤刪
#   4. 以 bind mount 讓 data/ 與 outputs/ 在主機上直接可見
# 維護提醒:
#   - 不得把 console 的 ports 改成 0.0.0.0 或省略前綴 IP。SRC-SAI §46 規定
#     非 loopback 曝露必須同時具備 admin token 與 TLS，而 compose 這一層
#     繞不過 assert_network_policy()，只會讓服務啟動失敗。
#   - 不得把 secrets volume 換成 bind mount 到版控目錄。
#   - 不得在 console 服務加 --formal；formal run 一律走 CLI（§208）。
#   - v0.1.0 新增：首版。
# 驗證方式:
#   - docker compose build
#   - docker compose run --rm pcmef pytest -q
#   - docker compose up console   然後開 http://localhost:8790
# ------------------------------------------------------------

name: pcmef

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  image: pcmef-research:local
  environment:
    # secret 一律由環境提供，映像與 compose 檔都不含實際值。
    PCMEF_SECRET_MASTER_KEY: ${PCMEF_SECRET_MASTER_KEY:-}
    PCMEF_ADMIN_TOKEN: ${PCMEF_ADMIN_TOKEN:-}
    PCMEF_STUB_MODELS: ${PCMEF_STUB_MODELS:-}
  volumes:
    # 前研究資料：唯讀掛入。SRC-SAI §38 要求 raw real 只讀備份，
    # 掛成 ro 讓「不小心覆寫原始資料」在檔案系統層就不可能發生。
    - ./data:/app/data:ro
    - ./outputs:/app/outputs
    - ./provenance:/app/provenance
    - ./artifacts:/app/artifacts
    - ./freeze:/app/freeze
    - pcmef-registry:/app/registry
    - pcmef-secrets:/app/secrets

services:
  # 一次性 CLI：docker compose run --rm pcmef <子指令>
  pcmef:
    <<: *common
    profiles: ["cli"]

  # 常駐本機主控台
  console:
    <<: *common
    command:
      - admin
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      # 容器跑起來就能在 UI 綁定四個 agent。只寫 draft registry ——
      # formal identity 仍然只能由 CLI 的 `llm snapshot --freeze` 產生，
      # 這一條沒有被放寬。
      - --enable-ui-bind
    ports:
      # 只綁主機的 loopback。容器內聽 0.0.0.0 是因為要讓 Docker 轉發，
      # 但主機端的曝露面仍然只有 127.0.0.1。
      #
      # 主機埠與 `pcmef admin serve` 的預設埠**刻意相同**（8790）：
      # 不管是本機直接跑還是容器跑，操作者記一個 http://localhost:8790 就好。
      # 代價是兩者不能同時開 —— 同時開時後啟動的那個會撞埠。
      # 真的需要同時對照時用 PCMEF_CONSOLE_PORT 指定另一個埠：
      #   PCMEF_CONSOLE_PORT=8791 docker compose up console
      #
      # 容器內側固定 8787，由上面的 command 明確指定，不受 DEFAULT_PORT 影響。
      # 內側用哪個埠對操作者不可見，因此不需要跟著改。
      - "127.0.0.1:${PCMEF_CONSOLE_PORT:-8790}:8787"
    environment:
      PCMEF_SECRET_MASTER_KEY: ${PCMEF_SECRET_MASTER_KEY:-}
      PCMEF_STUB_MODELS: ${PCMEF_STUB_MODELS:-}
      # 容器內必須綁 0.0.0.0 才收得到 Docker 的埠轉發，而 §46 規定
      # 非 loopback 曝露要同時具備 admin token 與 TLS。
      #
      # 上面的 ports 已經把主機端入口限縮成 127.0.0.1，因此對外沒有任何
      # 路由進得來 —— 這裡用 PCMEF_ADMIN_CONFINED_FORWARD 明確宣告這件事。
      # 宣告只在 wildcard 綁定時生效（見 admin/auth.py 的 is_wildcard），
      # 而且宣告不等於偵測：**改動下面那行 ports 的人，有責任一併重新評估**。
      # 把 127.0.0.1 改成 0.0.0.0 而留著這個旗標，這道防線就不再作用。
      #
      # 2026-08-31 之前這裡是要求操作者自備 PCMEF_ADMIN_TOKEN。改掉的原因是
      # 那個 token 擋不到任何人（入口本來就只有 loopback），卻讓
      # `docker compose up console` 在沒有 .env 時進入無聲的重啟迴圈 ——
      # 瀏覽器看到的是別的服務，症狀完全指不到真正的原因。
      PCMEF_ADMIN_CONFINED_FORWARD: "1"
      # 仍然可以自備 token；設了就會在寫入端點被要求。
      PCMEF_ADMIN_TOKEN: ${PCMEF_ADMIN_TOKEN:-}
    restart: unless-stopped

volumes:
  pcmef-registry:
  pcmef-secrets:
