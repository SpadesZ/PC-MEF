# PC-MEF Research System source maintenance contract
# 上下游: 由 pcmef.experiments.calibration_prereg 讀取與驗證；其 protocol_hash
#         連同 code commit / split hash / registry hash / initial lock hash /
#         ERR-001 hash 一併凍進 freeze/preregistrations/CAL-PREREG-001.prereg.json；
#         calibration 執行器日後只能照本檔跑，不得自行加減參數或判準。
# 檔案路徑: configs/calibration_preregistration.yaml
# 產生時間: 2026-08-30 10:10 +08:00
# 版本: v0.2.0
# 功能說明: 在**讀取 calibration partition 之前**寫死校準的全部規格 ——
#           目標函數、正規化、分階段參數分組與各階段的可辨識性論證、
#           固定/gauge/derived 成員、optimizer 與種子、邊界、收斂與評估上限、
#           重啟/平手/失敗處置，以及要留下哪些 artifact。
# 模組定位: calibration 的**預註冊契約**。它不是校準結果，也不是 lock ——
#           結果另存 artifact，凍結記錄另存 prereg.json。26 個參數不能一起 fit，
#           本檔的核心工作是把它們拆成各自可辨識的階段並寫出理由。
# 主要責任:
#   1. 界定 calibration 只能用哪一份資料（frozen calibration split，非 held-out）
#   2. 定義 distribution-level 目標函數、其正規化與事前固定的權重
#   3. 分五個階段登記參數群組，每一階段寫明「哪些 observable 識別哪些參數」
#   4. 明列 optimizer 不得碰的固定/gauge/derived 成員
#   5. 訂定 optimizer、seed、初始化、邊界、收斂、重啟、平手與失敗處置
# 維護提醒:
#   - 不得在讀過 calibration partition 之後修改本檔；要改必須開 amendment
#     並重跑，理由寫進 amendment 而不是改這裡（NOTE-035 的同一條規則）。
#   - 不得把四類 real class mean 寫成常數。目標函數一律在執行當下由
#     calibration split 讀出分佈；hard-code 均值等於把答案抄進判準。
#   - 不得讓 optimizer 觸碰 CG-1/2/3 的 fixed 成員或任何 derived 參數；
#     那些自由度在原理上不可辨識，動它們只會把簡併重新引入。
#   - 不得跳階段，也不得把後面階段的參數提前放進前面階段一起 fit；
#     階段順序就是可辨識性論證的順序。
#   - 不得因為某階段不收斂就放寬邊界或改權重重跑；NOT_CONVERGED 是合法結局。
#   - 不得在 stage 0 引入任何由真實資料導出的量；它的分母必須是 sigma_MC，
#     不是 s_f。這條是 AMD-003 的核心，改回去就會讓 stage 0 的
#     simulation-only 宣告再次變成假的。
#   - 不得手改 evaluation_budget.resolved 的數字；它由 calibration_plan 的
#     公式導出，CP-13 逐項比對，改一個就會 FAIL。
#   - v0.2.0 依 AMD-003 修正 stage 0 的 s_f 矛盾、消歧義 optimizer 預算、
#     新增 dimension_expansion 與 bounds.uniqueness，並更正 stage 3 的
#     Empty 拓樸措辭（NOTE-042）。
#   - v0.1.0 新增：首版校準預註冊（NOTE-041）。
# 驗證方式:
#   - py -3.10 -m pcmef.cli calibration preregister --validate
#   - py -3.10 -m pytest tests/unit/test_calibration_prereg.py -v
#   - py -3.10 -m pytest tests/unit/test_calibration_plan.py -v
# ------------------------------------------------------------

preregistration_id: CAL-PREREG-002
