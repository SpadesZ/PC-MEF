# 本檔凍結的是**規則與公式**，不是結果。
#
# 特別是：候選維度集合、入場判準、borderline 規則、共線性範圍、
# 0 維階段語意、預算公式與成本模型公式在此凍結；
# **實際 admitted 維度集合與實際校準預算不在此凍結**，
# 它們只能由使用本協定的 Stage 0 正式重跑導出。
# 任何以舊 artifact 投影出來的數字（例如 7 維 / 82 小時）都不是 binding。
binding_scope:
  frozen_here:
    - candidate dimensions per stage
    - CG gauge-fixed members and their claim boundaries
    - own-stage admission scope
    - generic conservative borderline rule
    - S0-B1..B5 secondary criterion (sigma stage only)
    - admitted-only collinearity scope
    - zero-dimensional stage semantics
    - optimizer budget formula
    - runtime cost model formula
  NOT_frozen_here:
    - the actual admitted dimension set
    - the actual per-stage dimension counts after admission
    - the actual calibration wall-clock budget
  derived_from: CAL-PREREG-003 stage 0 rerun, executed from scratch

