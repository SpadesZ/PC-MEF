    fixes:
      - stage 0 的 s_f 矛盾（宣稱 simulation-only 卻要先讀 calibration）
      - optimizer 預算三處互相矛盾且低估 8.6-25.7 倍
      - stage 3 Empty 拓樸的措辭與 NOTE-029 的缺陷描述雷同

# ===========================================================================
# 0. 資料來源
# ===========================================================================
# calibration 只能看見 real split 的 calibration partition。held-out 的 168 筆
# 在 E1 final 之前一次都不得開啟 —— 包括「只是看一下有沒有對」。
data:
  source_lock: real_split_policy
  # 取自 freeze/real_split_policy.lock.json，驗證時逐字比對。
  calibration_set_hash: 4bda77f6412afbaa225f75646f39b683e37de7d82f80ab94c7cb325648e0c22d
  eligible_set_hash: f76776e4ddd8ad14ade97c2517731963b8bfa6ec5317fd0b248ecf30273d0ac7
  calibration_counts: {Empty: 98, Water-filled: 98, Bubbly: 98, Misty: 98}
  total_calibration_recordings: 392

  # 原始資料的 bytes-level 雜湊**刻意留待執行當下計算**。現在去算它就必須
  # 讀取 calibration partition，而本檔的全部意義是先寫完再讀。
  raw_data_hash: COMPUTED_AT_CALIBRATION_START
  raw_data_hash_spec: >
    對 calibration partition 內每一筆 recording 的 canonical 陣列取
    core.hash.hash_array，依 recording_id 排序後 combine_hashes。
    該值必須寫入每一份 stage artifact 與最終的 calibrated_simulation.lock。

  # AMD-003：held-out 有 access_count，calibration 沒有。「還沒讀」因此
  # 只是一句話而不是一個可稽核的數字。補上獨立的 append-only 帳。
  first_access:
    ledger: data/splits/calibration_access_ledger.json
    count_now: 0
    definition: >
      一次 access = 讀取 calibration partition 內任何一筆 recording 的
      **數值**。計算 recording id 集合的雜湊不算（那是 split 結構，
      不揭露任何分佈資訊）；讀取數值以計算 raw_data_hash 或 s_f **算**。
    first_access_happens_at: stage 1 開始時，一次讀入並同時算出 raw_data_hash 與 s_f
    ordering_rule: >
      stage 0 必須在 first access **之前**完整跑完並凍結其 artifact。
      若帳上 count > 0 而 stage 0 artifact 不存在，代表順序已經反了，
      流程必須停止。

  forbidden_sources:
    - heldout_real（168 筆；E1 final 之前 access_count 必須維持 0）
    - 偏移量測試那次獨立採集（僅供 estimator 驗證，見 estimator_preregistration）
    - 任何 synthetic split（M3 尚未開始，且不得早於 E1 outcome）

# ===========================================================================
# 1. 目標函數
# ===========================================================================
objective:
  id: NW_DISTRIBUTION_DISCREPANCY
  form: "J = sum over (class c, feature f) of w[c,f] * NW(real[c,f], sim[c,f])"

  discrepancy:
    statistic: wasserstein_w1
    implementation: pcmef.stats.metrics.wasserstein_w1
    level: distribution
    detail: >
      逐 class × feature 取真實與模擬**整個分佈**的 1-Wasserstein 距離。
      比的是分佈，不是四個均值 —— 匹配均值會讓一個離散度完全錯誤的模型
      拿到滿分。

  # 這一段是本檔最容易被繞過的地方，因此把禁令寫在定義旁邊。
  forbidden_in_objective:
    - 把四類 real class mean 寫成常數（任何檔案、任何形式）
    - 以 |sim_mean - real_mean| 取代分佈距離
    - 在執行期以外的任何時點讀取 calibration partition 的數值
    - 針對某一類另設一條加分或減分項

normalization:
  scale: s_f
  implementation: pcmef.stats.metrics.feature_scale_iqr
  computed_from: calibration split 的**真實**值，逐 feature 池化（pooled over classes）
  computed_when: calibration 開始時計算**一次**，全部階段共用
  frozen: true
  rationale: >
    raw W1 帶物理單位，distance 差 5 mm 與 signal 差 0.005 MCPS 的 raw W1
    相差 1000 倍但失真程度相同（NOTE-024）。不正規化就等於讓 distance
    獨佔目標函數。s_f 取真實資料的 IQR，因此它不隨模擬參數改變 ——
    若每階段重算，optimizer 可以靠放大模擬離散度稀釋自己的誤差。
  maintenance_bound: >
    不得逐階段重算 s_f，也不得由模擬值計算 s_f。s_f <= 0 或非有限時
    必須 BLOCK 而非退回 1.0（feature_scale_iqr 已如此實作）。

weights:
  scheme: UNIFORM
  value: 1.0
  applies_to: 全部 4 classes x 4 features = 16 項
  fixed_before_seeing_data: true
  rationale: >
    NW 已經是無單位量，等權是唯一不需要額外辯護的選擇。任何非均勻權重
    都會需要「為什麼這一類/這個特徵更重要」的理由，而在看過資料之後
    才給得出的理由與挑一組讓結果好看的權重無法區分。
  maintenance_bound: 變更權重必須開 amendment，不得在執行期以參數傳入。

reporting:
  # 每一階段只**最佳化**自己那一組項，但必須把完整的 J 一併記錄，
  # 否則「改善了 signal、悄悄弄壞了 distance」不會有人看見。
  optimized_terms: 各階段 observables 宣告的子集
  monitored_terms: 全部 16 項（記錄但不最佳化）
  regression_guard:
    rule: >
      若某階段結束後，**未被該階段最佳化**的項的 NW 總和比該階段開始時
      惡化超過 regression_tolerance，該階段標記 SIDE_EFFECT_REGRESSION
      並停止流程，不得自動繼續下一階段。
    regression_tolerance: 0.10       # 相對值，事前固定

# ===========================================================================
# 2. optimizer 不得觸碰的參數
# ===========================================================================
# 這三個是 CG-1/2/3 裁決時選定的 gauge 固定項。它們對應的自由度在原理上
# 不可辨識（NOTE-031 / NOTE-034），把它們放進搜尋空間會直接重建簡併。
forbidden_parameters:
  gauge_fixed:
    - name: _SIGMA_T_REFERENCE_PER_M
      group: CG-1_extinction
      why: 三個密度與參考尺度精確簡併；固定 shared 的那一項，否則三類互相耦合
    - name: lighting.irradiance
      group: CG-2_brightness
      why: 實測為精確全域增益（1.0->2.0 能量比恰為 2.0000，正規化波形逐 bin 差 0.0）
    - name: _ROOM_LIGHT_RADIANCE
      group: CG-3_ambient
      why: 實測為 Ambient 上的精確純增益（線性度 4.0003/4.0000/4.0000）

  derived:
    - name: optical_path_to_distance
      why: 由幾何決定（monostatic），不是自由參數；SurrogateCalibration 已拒絕覆寫

  fixed_or_topology:
    - SPEED_OF_LIGHT_M_PER_S
    - TOF_RECORDING_POINTS
    - sample_interval_s
    - geometry.bottle_diameter_mm
    - geometry.wall_thickness_mm
    - geometry.sensor_to_bottle_mm
    - geometry.lateral_offset_mm
    - _INTERIOR_BASE_IOR

  # NOTE-037 維護邊界：不得因為 calibration 的結果回頭換 estimator。
  estimator:
    members:
      - SELECTED_ESTIMATOR (LEADING_EDGE)
      - detection_threshold_sigma (5.0)
      - min_return_bins (2)
    why: >
      estimator 由獨立預註冊以純物理判準選定，且它是 surrogate 身分的一部分
      （surrogate_hash 涵蓋它）。讓 calibration 動它等於用擬合結果回頭改
      已經凍結的 initial model。

# ===========================================================================
# 3. 邊界
# ===========================================================================
bounds:
  source: freeze/initial_simulation.lock.json -> payload.parameter_ranges
  binding_rule: >
    每一個被 fit 的參數，其 [lo, hi] 必須與已凍結的 lock **逐字相同**。
    驗證器逐項比對；不符即 FAIL。calibration 只能在凍結時登記的範圍內移動，
    這正是 initial freeze 的用途。

  # 已凍結的 lock 內有三個上界被存成**字串**而不是數字：YAML 1.1 的
  # `1.0e6`（無正負號）不解析為 float。lock 不可覆寫，parameter_ranges 也在
  # errata 的禁區內（改它就是改實驗本身），因此只能在此宣告數值解讀。
  declared_numeric_interpretations:
    - parameter: ambient_energy_to_mcps
      frozen_as: ["1e-06", "1.0e6"]
      interpreted_as: [1.0e-6, 1000000.0]
    - parameter: signal_energy_to_mcps
      frozen_as: ["1e-06", "1.0e6"]
      interpreted_as: [1.0e-6, 1000000.0]
    - parameter: sigma_width_to_mm
      frozen_as: ["1e-06", "1.0e6"]
      interpreted_as: [1.0e-6, 1000000.0]
  interpretation_rule: >
    只允許「字串經 float() 轉換後，再轉回字串與原值表示同一個十進位數」
    這一種解讀，且必須逐參數列出。不得對未列出的參數自動轉型 ——
    一個安靜的轉型會讓「邊界寫錯」與「邊界被改過」看起來一樣。

  out_of_bounds_policy: >
    optimizer 提出界外點時直接回傳 +inf 並記錄，不做 clip。
    clip 會讓最佳點落在邊界上而看不出它其實想往外走。

  # AMD-003：唯一重建的要求。
  uniqueness:
    resolver: pcmef.experiments.calibration_plan.resolve_numeric_bounds
    rule: >
      optimizer 使用的數值界線只能由**一條路徑**產生：先讀已凍結 lock 的
      `parameter_ranges`；原生為數字者直接使用，為字串者必須有本檔宣告的
      numeric interpretation，且 `float(凍結字面值)` 必須**恰好等於**宣告值。
      宣告與字面值不符即拒絕 —— 那等於在不改 lock 的情況下放寬界線，
      也就是第二套沒有被凍結的 bounds。
    recorded_as: bounds_resolution_hash（凍進 AMD-003 與 CAL-PREREG-002）
    maintenance_bound: >
      不得在 resolver 之外另算一次 bounds。只要有兩條路徑算得出 bounds，
      就會有兩套 bounds，而其中一套不在任何凍結物裡。

# ---------------------------------------------------------------------------
# 維度展開
# ---------------------------------------------------------------------------
# AMD-003：v0.1.0 只列參數名，於是 `_ALBEDO_BY_PRESET`（三類各一個純量）
# 究竟佔 1 個還是 3 個搜尋維度沒有答案，而它直接決定族群大小與預算。
# 未宣告展開的多值參數一律拒絕，不得隱含地佔一個維度。
dimension_expansion:
  _ALBEDO_BY_PRESET:
    kind: class_specific_scalars
    dimensions:
      - _ALBEDO_BY_PRESET.water
      - _ALBEDO_BY_PRESET.bubbly
      - _ALBEDO_BY_PRESET.misty
    shared_bounds: true
    why: >
      三類的單次散射反照率各自獨立（water 0.60 / bubbly 0.92 / misty 0.88），
      共用同一組登記界線 [0.0, 1.0]，但**不是**同一個自由度。
      把它算成一個維度會讓三類被迫共用同一個反照率，那是一條沒有人裁決過的
      物理假設。

# ===========================================================================
# 4. Stage 0 —— 可辨識性探測（純模擬，不碰 calibration partition）
# ===========================================================================
# 這一階段先於任何擬合，且**不需要真實資料**。它的存在理由是 NOTE-032 的
# 教訓：`_ROOM_LIGHT_RATIO` 比例拉 25 倍、總能量只變 0.058%，那是一個
# 「可以 fit、但 fit 出來沒有意義」的參數。與其事後解釋，不如事前量。
stage_0:
  name: identifiability probe
  reads_calibration_partition: false
  calibration_first_access: false

  # AMD-003：v0.1.0 的門檻以 s_f 為單位，而 s_f 是 **calibration split 的真實值**
  # 池化 IQR。那讓一個宣稱 simulation-only 的階段在原理上必須先讀真實資料 ——
  # 宣告與規格自相矛盾。改用模擬自身的雜訊底線，見 normaliser。
  normaliser:
    symbol: sigma_MC
    definition: >
      在**凍結的 initial 參數值**下，以 R 組獨立模擬種子各算一次，
      取每一個 observable 的樣本標準差。純模擬，完全不需要真實資料。
    replicates: 8
    seed_set: [3001, 3002, 3003, 3004, 3005, 3006, 3007, 3008]
    why_not_s_f: >
      s_f 由 calibration split 的真實值算出，用它當 stage 0 的分母會使
      「要擬合哪些參數」這件事取決於真實資料，形成一個**資料相依的模型選擇**
      步驟，且會把 first access 提前到沒有科學必要的時點。
      sigma_MC 回答的才是 stage 0 真正要問的問題：**optimizer 看不看得見
      這個參數**。在 CRN 下階段內目標函數是決定性的，因此效應小於 sigma_MC
      的參數，其擬合值只是所選種子的產物 —— 那正是 verification seeds 會在
      燒掉一整個階段預算之後才判為 SEED_OVERFIT 的情況。stage 0 提前擋掉它。

  method: >
    對每一個候選 fit 參數，把它設到登記邊界的下界與上界各算一次
    （其餘參數維持 initial 值），量它在**每一個 observable** 上造成的變化。
    另以 R 組種子在 initial 值上量 sigma_MC。全程只用模擬。

  admission_threshold:
    rule: |
      leverage_sim(p, o) = |o(p=hi) - o(p=lo)| / sigma_MC(o)
      max_o leverage_sim(p, o) >= K  -> ADMITTED（可進入其所屬階段擬合）
      max_o leverage_sim(p, o) <  K  -> GAUGE_FIXED（固定於 initial 值，不擬合）
      落在 [K/2, 2K] 者 -> BORDERLINE，**不得自動歸類**
    threshold_value: 10.0
    borderline_band: [5.0, 20.0]
    borderline_outcome: STAGE0_ADJUDICATION_REQUIRED
    threshold_rationale: >
      門檻以模擬自身的種子間標準差為單位。K = 10 表示「把參數掃過整個登記
      範圍」造成的變化是雜訊底線的十倍；以 R = 8 個重複計，那相當於
      10*sqrt(8) ≈ 28 個平均值標準誤，不存在模稜兩可。K 事前選定且未經調校。

      落在 [5, 20] 者標為 BORDERLINE 並**停止流程**等待裁決，而不是四捨五入
      到某一邊 —— 這與 estimator 那一輪的 TIE_BREAK_REQUIRED 是同一條規則：
      分不出來就是分不出來，不得為了讓流程往前走而擇一。

  collinearity_check:
    rule: >
      對每一階段內的參數兩兩計算響應向量的餘弦相似度。響應向量的每一個
      分量先除以該 observable 的 sigma_MC，因此向量是無單位的 ——
      未正規化的餘弦會隨 observable 的單位改變而改變，那個數字沒有意義。
      |cos| >= 0.98 視為該階段內的簡併對，必須在開始擬合前依 CG-1/CG-2 的
      同一套理由（provenance 決定固定哪一個，不是「哪個好 fit」）擇一固定，
      並把裁決寫成新的 confounded group 記錄。
    threshold_value: 0.98
    normalised_by: sigma_MC

  outcome_is_binding: >
    stage 0 的結論**改變後續階段的參數集合**，因此它必須在讀取 calibration
    partition 之前執行完畢並凍結其 artifact。不得在看過擬合結果後重跑 stage 0。

# ---------------------------------------------------------------------------
# s_f 相對槓桿：保留為**不具決定權**的診斷
# ---------------------------------------------------------------------------
# v0.1.0 想用 s_f 問的那個問題（這個參數對目標函數重不重要）本身是合理的，
# 只是它不能當 stage 0 的入場券。改列為 stage 1 開始時計算並記錄的診斷。
s_f_relative_leverage_diagnostic:
  computed_at: stage 1 start（s_f 已由 calibration first access 合法算出之後）
  gating: false
  rule: >
    對每一個 **已由 stage 0 admitted** 的參數，記錄
    leverage_sf(p, o) = |o(p=hi) - o(p=lo)| / s_f(o)。
  forbidden_use: >
    **不得**以本診斷改變任何階段的參數集合。參數集合在 stage 0 就已定案，
    而 stage 0 沒有看過真實資料。事後依真實資料剔除參數，就是資料相依的
    模型選擇，且它會發生在已經看過資料之後 —— 那正是預註冊要防的事。
  permitted_use: 寫進 artifact，供論文說明各參數對目標函數的相對重要性

# ===========================================================================
# 5. 分階段參數群組
# ===========================================================================
# 順序不可調換：每一階段的可辨識性論證都建立在前面階段已固定的基礎上。
# 各階段擬合完畢後，其參數即**凍結**，後續階段不得再動。
stagewise:

  # -------------------------------------------------------------------
  - stage: 1
    id: AMBIENT
    name: Ambient 通道
    parameters: [ambient_energy_to_mcps, ambient_jitter_relative]
    observables:
      - ambient_rate_mcps 的分佈**位置**（median）
      - ambient_rate_mcps 的分佈**離散度**（IQR / median）
    identifiability: >
      **結構性解耦，非近似。** Ambient 只由 AMBIENT_ONLY pass 取得
      （VCSEL 關閉，NOTE-034），因此它與 active pass 的任何參數無關。
      實測 A2：VCSEL 功率 1.0->4.0 時 ambient 由 3.603355 變為 3.603355
      （完全相同），即 lighting.irradiance 對 Ambient 的影響**恰為 0**。

      兩個參數各有獨立的統計量：`ambient_energy_to_mcps` 是 Ambient 上的
      精確純增益（實測線性度 4.0003 / 4.0000 / 4.0000），只移動分佈位置；
      `ambient_jitter_relative` 是相對抖動，只改變離散度而不改變位置。
      兩個參數、兩個互相獨立的統計量 -> 恰好可辨識。
    why_first: >
      它與其餘四階段**沒有**任何共用參數，先做不會被後面推翻，
      也立刻從搜尋空間移除兩個自由度。
    forbidden_here: [_ROOM_LIGHT_RADIANCE]

  # -------------------------------------------------------------------
  - stage: 2
    id: SIGNAL_SCALE
    name: Active Signal 的能量->MCPS 換算
    parameters: [signal_energy_to_mcps, noise_relative_sigma]
    observables:
      - signal_rate_mcps 的分佈位置（**四類池化**）
      - signal_rate_mcps 的分佈離散度
    identifiability: >
      `signal_energy_to_mcps` 是套用在 estimator **之後**的單位換算，
      對全部四類等比作用，且**不影響 distance**（S2 實測：irradiance
      1.0->4.0 時估計距離變化 0.0）。因此它由四類池化後的 signal 位置
      唯一決定，1 個自由度對 1 個統計量。

      使用池化位置而非逐類位置是刻意的：逐類位置的**差異**由 stage 3/4 的
      幾何與介質參數決定，把它們交給一個全域增益去擬合，就是拿一個旋鈕
      去補另一組旋鈕的錯。
    known_residual_confound: >
      **必須誠實記下**：`_FOIL_REFLECTANCE_940NM`、`_FOIL_SURFACE_ALPHA`、
      `_FOIL_SIZE_TO_DIAMETER_RATIO` 同樣會縮放回波振幅，與本階段的增益
      在 signal 位置上**近似簡併**。三者不在本階段，而是在 stage 3 由
      **distance 通道**區分：post-hoc 增益不會移動 distance，但改變物理
      振幅會經由 LEADING_EDGE 的 range walk 移動 distance
      （實測振幅 10->500 時距離變動 10.0%，NOTE-037）。
      這個區分是**弱**的，因此三者能否進入擬合由 stage 0 的 leverage 門檻
      決定；未達門檻即 gauge-fix，讓 post-hoc 增益吸收整體位準。
    forbidden_here: [lighting.irradiance]

  # -------------------------------------------------------------------
  - stage: 3
    id: GEOMETRY_SURFACE_FOIL
    name: 幾何 / 表面 / 箔片
    parameters:
      - _FOIL_GAP_TO_BOTTLE_RATIO
      - _FOIL_REFLECTANCE_940NM
      - _FOIL_SURFACE_ALPHA
      - _FOIL_SIZE_TO_DIAMETER_RATIO
      - _BOTTLE_SURFACE_ALPHA
      - sensor.fov_deg
      - light.cutoff_angle_deg
    not_fitted_in_this_stage:
      - name: foil_orientation
        status: NOT_FITTED
        why: >
          登記值 facing_camera 是**目前唯一有實作**的朝向，`_foil_transform()`
          對其餘取值直接拒絕而不退回預設。它因此不是連續旋鈕而是場景結構選項；
          換朝向是 scene-level 變更，該開新 run 而不是在 calibration 內掃描。
    observables:
      - "**Empty 類**的 distance_mm 分佈位置與離散度"
      - "**Empty 類**的 signal_rate_mcps 分佈形狀（已由 stage 2 固定位置）"
      - Empty 的 sigma_like 分佈（作為波形寬度的間接觀測）
    identifiability: >
      **關鍵結構事實：Empty 沒有參與介質，但它有完整的殼＋空氣＋殼幾何。**

      AMD-003 更正 v0.1.0 的措辭。原文「只在 `medium_preset != "empty"` 時
      建立內部介質」與 NOTE-029 當初描述**缺陷**時的句子幾乎相同，容易被讀成
      「Empty 不建內圓柱」—— 那正是已經修掉的實心玻璃柱錯誤。逐行核對後的
      事實是：

      * `build_scene_dict()` 的 `scene["bottle_interior"]` **無條件建立**，
        四類皆然（mitsuba_adapter.py，NOTE-029 的註解就寫在該段上方）。
      * 只有 `interior["interior"] = medium` 這一行是條件式的，由
        `_medium_dict()` 決定；`_DENSITY_KEY_BY_PRESET` 沒有 "empty" 這個鍵，
        因此 Empty 取不到密度、回傳 None、不掛參與介質。
      * `_INTERIOR_BASE_IOR["empty"] = "air"`，內圓柱是
        `int_ior=air / ext_ior=bk7`。
      * 實測建構結果：四類的 `bottle_interior` 皆存在，
        r_in = 26.5 mm、r_out = 28.5 mm（壁厚 2.0 mm），
        Empty 的 `int_ior=air` 且 `has_participating_medium=False`。

      因此 Empty 的全部 observable 是幾何 / 表面 / 箔片參數的函數，
      **與 stage 4 的三個密度與三個 albedo 完全無關**。本階段只用 Empty
      一類擬合 —— 這不是為了省事，而是唯一能讓幾何與介質不互相污染的切法。
      這條由 `tests/simulation/test_empty_topology.py` 逐次確認，不靠記憶。

      各參數的獨立簽名：
      * `_FOIL_GAP_TO_BOTTLE_RATIO` 移動箔片**位置** -> 移動遠側回波的
        **時間** -> distance 位置。這是 distance 絕對值的主要把手。
      * `_FOIL_REFLECTANCE_940NM` / `_FOIL_SURFACE_ALPHA` /
        `_FOIL_SIZE_TO_DIAMETER_RATIO` 改變箔片回波**振幅與角度分佈**
        -> signal 形狀，並經 range walk 微幅影響 distance。
      * `_BOTTLE_SURFACE_ALPHA` 改變前玻璃 GGX lobe 寬度 -> 前緣回波與
        遠側回波的**相對強度** -> sigma_like 與 distance 的離散度。
      * `sensor.fov_deg` / `light.cutoff_angle_deg` 改變接收/照明錐角
        -> 邊緣路徑的加權（NOTE-033：fov 是全角、cutoff 是半角）。
      * `distance_offset_mm` 是加在 distance 上的常數偏移。
    declared_degeneracy:
      id: CG-4_absolute_distance
      members: [_FOIL_GAP_TO_BOTTLE_RATIO, distance_offset_mm]
      status: MUST_BE_DECIDED_BY_STAGE_0
      why: >
        兩者都讓**四類的 distance 一起平移**，在 distance 位置這個統計量上
        精確簡併。stage 0 的共線性檢查必然把它們判為簡併對，屆時必須依
        provenance 擇一固定：`_FOIL_GAP_TO_BOTTLE_RATIO` 是
        RECONSTRUCTED（箔片「存在」有依據，「在哪」沒有），
        `distance_offset_mm` 是 PLACEHOLDER 的純數值修正項且無物理來源。
      preregistered_ruling: >
        **固定 `distance_offset_mm = 0.0`，擬合 `_FOIL_GAP_TO_BOTTLE_RATIO`。**
        理由與 CG-1/CG-2 同一套：固定項要選沒有物理內容的那一個，
        讓有幾何意義的那一個承載資訊。一個非零的 distance_offset_mm 等於
        宣稱「模擬的光程對、但讀數要平移」，那不是物理，是把殘差藏起來。
        本裁決在看任何資料之前寫下，stage 0 只確認簡併是否如預期存在。
      claim_boundary: >
        校準後的 `_FOIL_GAP_TO_BOTTLE_RATIO` **不得**被解讀為真實裝置中
        箔片與瓶子的實際距離；它吸收了本階段所有未建模的絕對光程誤差。

  # -------------------------------------------------------------------
  - stage: 4
    id: PARTICIPATING_MEDIA
    name: 參與介質
    parameters:
      - medium.turbidity          # Water-filled
      - medium.bubble_density     # Bubbly
      - medium.mist_density       # Misty
      - _ALBEDO_BY_PRESET         # 三個 class-specific 純量：water / bubbly / misty
    observables:
      - "Water-filled / Bubbly / Misty 三類**相對 Empty** 的 distance 位移"
      - 三類的 signal_rate_mcps 分佈（位置已由 stage 2 的全域增益固定）
      - 三類的 sigma_like 分佈
    identifiability: >
      幾何在 stage 3 已由 Empty 單獨釘死，因此三個醫質類別與 Empty 的
      **差異**只能來自介質。每一類各有自己的密度與 albedo，且**不共用**
      —— 三類之間沒有交叉項，等於三個各自獨立的二參數子問題。

      同一類內密度與 albedo 的區分：密度（-> σt）決定穿透衰減，主要作用在
      遠側箔片回波的**振幅與到達時間**（Water 的實測位移 +15.20 mm 與理想
      全水路徑 Δd=(n-1)L=17.65 mm 同號同量級）；albedo（= σs/σt）決定
      被散射回來的比例，主要作用在**主窗內的回波形狀**與 sigma_like。
      兩者並非正交，因此**必須**由 stage 0 的共線性檢查逐類確認
      |cos| < 0.98；未通過者依 CG-1 的同一套理由固定 albedo、擬合密度
      （σt 是規格列為 validation-frozen 的量，albedo 無一手來源）。
    forbidden_here: [_SIGMA_T_REFERENCE_PER_M]
    claim_boundary: >
      校準後的三個密度**不得**解讀為絕對濁度／氣泡數密度／霧密度；
      可宣稱的只有 σt = density x _SIGMA_T_REFERENCE_PER_M 這個乘積
      （CG-1 的既有 claim boundary，此處沿用）。

  # -------------------------------------------------------------------
  - stage: 5
    id: SENSOR_SURROGATE
    name: 感測器替身的 Sigma 映射
    parameters: [sigma_width_to_mm, sigma_snr_weight, sigma_multipath_weight]
    observables:
      - 四類的 sigma_like 分佈位置
      - 四類的 sigma_like 分佈離散度
      - sigma_like 與 signal_rate_mcps 的**跨類共變**（SNR 項的簽名）
      - sigma_like 與 out_of_window_energy 的跨類共變（multipath 項的簽名）
    identifiability: >
      前四階段結束後，波形本身已完全固定；本階段只擬合「由已固定的波形
      算出 sigma_like」的映射，因此它**不會回頭改變** distance / ambient /
      signal 三個通道 —— 這是唯一一個放在最後不會污染前面的階段。

      三個參數的簽名可分：`sigma_width_to_mm` 是純增益（移動位置）；
      `sigma_snr_weight` 只在 SNR 隨類別變化時產生跨類差異；
      `sigma_multipath_weight` 只在 multipath 能量隨類別變化時產生跨類差異。
      由於四類的 SNR 與 multipath 排序**不同**（NOTE-032 量到 Empty 與
      Water 的 out_of_window 比例差一個數量級），兩個權重不會退化成同一個
      方向 —— 但這仍須由 stage 0 的共線性檢查證實，不得假設。
    claim_boundary: >
      sigma_like **不得**被稱為真實 VL53L0X internal Sigma（NOTE-001）；
      本階段校準的是替身的內部映射，不是對暫存器語意的宣稱。

# ---------------------------------------------------------------------------
# 不進入任何擬合階段的 calibration_only 參數
# ---------------------------------------------------------------------------
# 它們在 registry 裡是 calibration_only（可被 calibration 寫入），但它們是
# **數值/離散化設定**而不是物理量。用資料去 fit 它們沒有意義：spp 調高只是
# 雜訊變小，那不是「更像真實感測器」。因此在此宣告固定於 initial 值。
not_fitted:
  policy: HELD_AT_FROZEN_INITIAL_VALUE
  members:
    - name: spp
      value: 16
      why: Monte Carlo 取樣數；提高只降低估計量的變異，不改變被估計的物理量
    - name: resolution
      value: [64, 64]
      why: 像面解析度；surrogate 對全像面加總，解析度是離散化而非場景性質
    - name: temporal_bins
      value: 128
      why: 時間軸分箱數；改變它會同時改變 bin 寬與所有以 bin 為單位的量
    - name: max_depth
      value: 12
      why: 路徑追蹤深度上限；由 NOTE-029 的 lineage 實驗定為足以涵蓋箔片家族
    - name: bounce_budget
      value: 3.0
      why: 時間窗涵蓋範圍的倍率；屬窗口設定，NOTE-027 已以實測末端餘裕 31% 定案
    - name: _LEADING_MARGIN_BINS
      value: 8
      why: 時間窗前緣餘裕（以 bin 數表示，NOTE-027）；窗口設定而非物理量
    - name: foil_orientation
      value: facing_camera
      why: 唯一有實作的朝向；換朝向是 scene-level 變更（見 stage 3）
    - name: distance_offset_mm
      value: 0.0
      why: CG-4 的 gauge 固定項（見 stage 3 的 preregistered_ruling）
  maintenance_bound: >
    要把其中任何一項改為可擬合，必須開 amendment 並說明它為何是物理量。
    「調它結果會變好」不是理由。

# ===========================================================================
# 6. Optimizer
# ===========================================================================
optimizer:
  common_random_numbers:
    rule: >
      同一階段內**所有**評估共用同一組模擬種子。不共用的話目標函數會帶
      Monte Carlo 雜訊，optimizer 會去追雜訊而不是追參數。
      這與 e1_evaluation_design 對 Initial/Calibrated 的要求是同一條原則。
    seeds: {Empty: 1001, Water-filled: 1002, Bubbly: 1042, Misty: 1004}

  verification_seeds:
    rule: >
      每階段收斂後，用一組**不同的**種子重算一次目標函數，確認改善不是
      種子專屬的過擬合。相對劣化超過 verification_tolerance 即標記
      SEED_OVERFIT 並停止流程。
    seeds: {Empty: 2001, Water-filled: 2002, Bubbly: 2042, Misty: 2004}
    verification_tolerance: 0.10
    used_once_per_stage: true

  # AMD-003：v0.1.0 的 `scalar_stages.applies_to` 列的是**參數**而不是階段，
  # 於是「stage 1 有兩個參數，要不要逐一純量搜尋」沒有答案。現在只有一條路：
  # 每個階段一律以 differential_evolution 在該階段的全部維度上求解。
  # 目前沒有任何階段只有一個維度；即使有，DE 一樣適用（P = 16）。
  method_rule: >
    每個階段一律使用 scipy.optimize.differential_evolution，在該階段展開後的
    全部維度上同時求解。不存在逐參數的純量搜尋路徑。

  multivariate_stages:
    method: scipy.optimize.differential_evolution
    options:
      strategy: best1bin
      init: sobol
      popsize: 15
      mutation: [0.5, 1.0]
      recombination: 0.7
      tol: 0.01
      polish: false          # polish 用 L-BFGS-B，對雜訊目標取數值梯度沒有意義
      updating: deferred     # 與 workers 平行化相容且結果與序列一致
    seed: 20260829
    maxiter: 100
    initialization: >
      Sobol 序列覆蓋整個邊界盒，另**強制**把 initial_simulation.lock 的
      initial 值放進初始族群第 0 個個體 —— 這保證優化結果不會比凍結的起點更差,
      且讓「資料沒有要求任何改變」是一個可達成的結局。
    parallelism: >
      允許以 workers 平行化。`updating: deferred` 下平行與序列產生**相同**的
      評估序列與相同的結果，因此平行化只影響時間，不影響科學。
      若某次平行執行的 nfev 或最終參數與序列不同，該次執行作廢並必須查明原因。

  seeds:
    optimizer_seed: 20260829
    seed_derivation: >
      重啟第 k 次使用 optimizer_seed + 1000*k，k 由 0 起算。
      種子由公式決定而非逐次挑選，因此「換個種子直到結果好看」留得下痕跡。

# -------------------------------------------------------------------
# 評估預算 —— 由公式決定，不是由人估
# -------------------------------------------------------------------
# AMD-003：v0.1.0 同時寫了 `max_evaluations_per_stage: 3000` 與 `maxiter: 200`，
# 兩者**在任何階段都不可能同時成立**。實測 scipy 1.15.3：
#   N=2 -> nfev 4192 / N=3 -> 11584 / N=4 -> 12864 / N=7 -> 25728
# 其中 N=7 已是宣稱預算的 8.6 倍，再乘 3 次重啟則是 25.7 倍。
# 根因是把 `popsize` 當成族群大小，但它是**乘數**，而 init='sobol' 還會把
# 族群補到 2 的冪。預算因此改為由公式導出，並由程式強制。
evaluation_budget:
  population_rule: |
    P(N) = 2 ** ceil(log2(popsize * N))        # scipy init='sobol' 的實際規則
    來源：scipy/optimize/_differentialevolution.py
          n_s = int(2 ** np.ceil(np.log2(self.num_population_members)))
  per_restart_rule: |
    budget_per_restart(N) = P(N) * (maxiter + 1)
    scipy 先評估整個初始族群，之後每一代至多再評估一個族群量。
  per_stage_rule: |
    budget_per_stage(N) = restarts * budget_per_restart(N)

  # 以 popsize=15、maxiter=100、restarts=3 展開。這張表是**規範性**的：
  # 執行器算出來的值必須與它逐項相符，否則預註冊與程式已經分家。
  resolved:
    AMBIENT:             {dimensions: 2, population: 32,  per_restart: 3232,  per_stage: 9696}
    SIGNAL_SCALE:        {dimensions: 2, population: 32,  per_restart: 3232,  per_stage: 9696}
    GEOMETRY_SURFACE_FOIL: {dimensions: 7, population: 128, per_restart: 12928, per_stage: 38784}
    PARTICIPATING_MEDIA: {dimensions: 6, population: 128, per_restart: 12928, per_stage: 38784}
    SENSOR_SURROGATE:    {dimensions: 3, population: 64,  per_restart: 6464,  per_stage: 19392}
  total_evaluations: 116352

  counting:
    unit: 一次目標函數呼叫（= 一次四類 x 兩 pass 的模擬與一次 J 計算）
    counted_by: 執行器自己計數，**不採信** scipy 回報的 nfev
    counted_even_when: [NON_FINITE, CRASHED]
    rationale: >
      預算的意義是「這個階段最多能消耗多少模擬」。失敗的評估一樣花了時間、
      一樣可能被用來探索地形，不計入的話預算就不是上限。
      不採信 nfev 是因為那是函式庫事後回報的數字，而守衛必須在**超出的當下**
      就中止，不是跑完才發現。

  exhaustion:
    outcome: NOT_CONVERGED
    behaviour: >
      守衛在第 (budget + 1) 次評估被要求時立即拋出並中止該階段。
      記錄 best-so-far 但階段標記 NOT_CONVERGED，且 calibrated_simulation
      不得凍結。
    forbidden:
      - 取 best-so-far 並宣稱收斂
      - 提高 maxiter / popsize / restarts 後重跑並只保留後者
      - 縮小邊界讓搜尋變容易

  cost_disclosure: >
    以每次評估約 2 秒估算（64x64、spp=16、128 bins、四類各兩 pass），
    全部五階段 116,352 次評估約需 65 小時單執行緒。這個數字寫在這裡是為了
    讓「預算不夠用」在開始之前就被看見。若實際不可行，正確處置是開 amendment
    調整 maxiter/popsize 並重新導出本表，**不是**在執行中途悄悄改參數。

convergence:
  criterion: >
    differential_evolution 的標準收斂條件
    （std(population energies) <= tol * |mean(population energies)|），
    或 scalar 階段的 xatol。
  additional_requirement: >
    收斂當下的目標值必須優於該階段**起始**目標值；若最佳點就是起點，
    該階段結論為 NO_IMPROVEMENT_REQUIRED，參數維持 initial 值。
    這是合法且應該被記錄的結局，不是失敗。
  non_convergence:
    outcome: NOT_CONVERGED
    is_legal_terminal_state: true
    rule: >
      評估上限用盡而未達收斂條件時，記錄 best-so-far 但階段標記
      NOT_CONVERGED，**且 calibrated_simulation 不得凍結**。
      不得改用 best-so-far 並宣稱收斂，也不得為了收斂而放寬 tol 或邊界。

restart:
  policy: FIXED_COUNT
  count: 3
  rule: >
    每階段以 seed_derivation 給定的三個種子各跑一次，取目標值最小者。
    重啟次數事前固定，不得因為「再試一次可能更好」而追加。
  divergence_report: >
    三次重啟的最佳目標值若相對全距超過 0.05，必須在 artifact 中標記
    MULTIMODAL 並記錄三組參數；這代表目標函數有多個近似等價的解，
    是可辨識性的警訊而不是可以取平均的雜訊。

tie_break:
  epsilon: 1.0e-3            # 目標值的相對差
  rule: >
    兩組候選的目標值相對差小於 epsilon 時，取在**正規化邊界空間**中
    離 initial 值 L2 距離較小的那一組。
  rationale: >
    資料分不出來的時候就不要動。initial model 是已凍結的參考點，
    「最小位移」是唯一不需要引入新偏好的平手規則 —— 任何其他規則
    （取較大值、取中點、取讓某一類好看的）都是在無資訊處注入選擇。

failure_handling:
  non_finite_objective:
    rule: 模擬崩潰、NaN、Inf 或非有限目標值一律回傳 +inf 並完整記錄該次評估的參數
  failed_evaluation_budget:
    threshold: 0.20
    rule: >
      單一階段內失敗評估比例超過 20% 時，該階段標記 UNSTABLE_LANDSCAPE 並停止。
      在一個五分之一都算不出來的地形上找到的最小值，不是最小值。
  simulator_crash:
    rule: >
      沿用 NOTE-012 的子行程隔離：崩潰只讓該次評估失敗，不讓整個階段中止，
      但子行程的 exit code 必須完整記錄，不得吞掉。
  forbidden_recovery:
    - 放寬邊界
    - 放寬 tol 或提高 max_evaluations 後重跑並只保留後者
    - 改變權重或 s_f
    - 改用「差不多就好」的收斂判定

# ===========================================================================
# 7. Artifact 記錄
# ===========================================================================
artifacts:
  root: outputs/calibration
  per_evaluation:
    file: outputs/calibration/stage_<id>/evaluations.jsonl
    # 欄位名一律是裸識別字，說明另寫在 field_notes ——
    # 欄位清單同時是驗證器比對的對象，混入說明文字會讓比對失去意義。
    fields:
      - evaluation_index
      - parameters
      - objective_total
      - objective_terms
      - w1_raw_terms
      - simulation_run_identity_hash
      - seeds_used
      - status
      - runtime_s
    field_notes:
      parameters: 該階段全部被 fit 的參數值
      objective_terms: 16 項逐 class x feature 的 NW，含未被最佳化的
      w1_raw_terms: 帶物理單位的 raw W1，供解釋用
      status: OK / NON_FINITE / CRASHED
  per_stage:
    file: outputs/calibration/stage_<id>/stage_summary.json
    fields:
      - stage_id
      - outcome
      - fitted_parameters
      - objective_before
      - objective_after
      - monitored_terms_before
      - monitored_terms_after
      - verification_seed_objective
      - restart_results
      - evaluations_used
      - evaluations_budget
      - preregistration_hash
      - raw_data_hash
    allowed_outcomes:
      - CONVERGED
      - NO_IMPROVEMENT_REQUIRED
      - NOT_CONVERGED
      - SIDE_EFFECT_REGRESSION
      - SEED_OVERFIT
      - UNSTABLE_LANDSCAPE
      - MULTIMODAL
    field_notes:
      fitted_parameters: 值、邊界、以及是否貼邊
      restart_results: 三次重啟各自的最佳目標值與參數
  final:
    file: outputs/calibration/calibration_report.json
    must_contain:
      - 全部五階段的 stage_summary
      - stage_0 的 leverage 與共線性矩陣
      - 每一個 calibration_only 參數的最終狀態
        （FITTED / GAUGE_FIXED / HELD_AT_INITIAL）
      - preregistration_hash 與 protocol_hash
      - initial_simulation lock hash 與 ERR-001 hash
  parameter_boundary_report:
    rule: >
      任何最終落在邊界上（距邊界 < 1% 範圍寬）的參數必須被標記。
      貼邊代表資料想把它推到登記範圍之外，那是 initial freeze 的範圍
      訂錯了，必須具名報告而不是接受該值。

# ===========================================================================
# 8. 完成後不得自動進行的事
# ===========================================================================
after_calibration_forbidden:
  - 自動凍結 calibrated_simulation.lock（凍結是獨立動作，需先過稽核）
  - 開啟 held-out（E1 final 之前 access_count 必須維持 0）
  - 依校準結果回頭修改 estimator、initial_simulation.lock 或本預註冊
  - 以校準後的模擬產生 synthetic split（M3 不得早於 E1 outcome）
