supersedes:
  preregistration_id: CAL-PREREG-001
  record_hash: a17dd93982e496b7a5faa538aa0c99b72a5067ac61e901e3a299258576b3254a
  protocol_hash: 77365cc30413d4eaa940fcc224ac9b344d92f8ace6780b0d2f369a592e0900bf
  note: >
    CAL-PREREG-001 保留不刪除（append-only）。它記錄的 v0.1.0 協定帶有
    AMD-003 所列的三項缺陷，因此**不得**用於執行；操作版本是本檔。

amendments:
