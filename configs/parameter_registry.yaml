# ---------------------------------------------------------------------------
# 已知的參數重複控制（confounded groups）
# ---------------------------------------------------------------------------
# 同一組內的參數共同決定一個物理量，只有組合可辨識。calibration 時必須
# 固定其中一個或加上限制，否則搜尋空間有無限多組等價解，且結果無法解釋。
confounded_groups:
  - id: CG-1_extinction
    physical_quantity: 介質消光係數 sigma_t
    members: [_SIGMA_T_REFERENCE_PER_M, medium.turbidity, medium.bubble_density,
              medium.mist_density]
    relation: sigma_t = density * _SIGMA_T_REFERENCE_PER_M
    decision:
      status: RESOLVED
      decided_on: "2026-08-28"
      fixed: [_SIGMA_T_REFERENCE_PER_M]
      calibrated: [medium.turbidity, medium.bubble_density, medium.mist_density]
      rationale: >
        四個成員共同決定三個可觀測量（每類一個 sigma_t），恰好多一個自由度，
        且該自由度是純粹的尺度 —— 固定任一項在數值上都可行，因此不能用
        「哪個比較好 fit」來選，只能用 provenance 與可解釋性選。

        其一，provenance 上四者平手（全部 PLACEHOLDER），但**不對稱**：
        SRC-SAI §9 的 scenario.yaml 草案把 bubble_density 標為
        <validation-frozen range>，也就是規格本身已經把「密度」定位成
        由 validation 決定的量；規格從未提及參考尺度這個東西，它是本實作
        為了換算單位而引入的。把規格指名要校準的量固定起來、去校準一個
        規格沒有的量，方向相反。

        其二，固定的必須是 shared 那一項。固定某一類的密度（例如 turbidity）
        等於讓「水有多濁」成為定義而非結果，並使其餘兩類的 sigma_t 都相對於
        一個關於水的任意選擇而定，把原本互相獨立的三類耦合在一起。
        固定 shared 的參考尺度則只移除那一個多餘自由度，三類互不牽連。

        其三，_SIGMA_T_REFERENCE_PER_M = 100.0 的來源本身就證明它不是量測值：
        程式註解明寫「選 100 是為了讓密度 0.1-0.3 得到光學厚度 tau 約 0.6-1.7」
        —— 它是與密度一起挑出來湊出某個 tau 範圍的，不是獨立觀測。
        一個由挑選產生的數字沒有資格當校準結果，但完全有資格當 gauge。
      claim_boundary: >
        _SIGMA_T_REFERENCE_PER_M 固定為 100.0 /m 是 **gauge fixing，不是量測**。
        因此校準後的 turbidity / bubble_density / mist_density
        **不得被解讀為絕對物理密度或濁度**，也不得與文獻的濁度值比較；
        它們只有在「乘上本 gauge 得到 sigma_t」這個意義下成立。
        可宣稱的物理量只有 sigma_t (1/m) 本身。

  - id: CG-2_brightness
    physical_quantity: 回到感測器的絕對能量尺度
    # 2026-08-28 更正：原本登記為「三者相乘」是**錯的**，實測推翻。
    members: [lighting.irradiance, signal_energy_to_mcps]
    relation: Signal ∝ irradiance × signal_energy_to_mcps（兩者為精確簡併）
    decision:
      status: RESOLVED
      decided_on: "2026-08-28"
      fixed: [lighting.irradiance]
      calibrated: [signal_energy_to_mcps]
      rationale: >
        **先更正組成。** 原 registry 把 _FOIL_REFLECTANCE_940NM 也列為成員，
        理由是「三者相乘」。實測推翻此說（probe_cg2，64x64/spp=16/128 bins）：

          irradiance 1.0 -> 2.0      能量比 2.0000，波形正規化後逐 bin 差 **0.0**
          foil 0.85 -> 0.425         能量比 0.983(Empty) / 0.768(Water)，
                                     正規化波形 L1 差 0.020 / 0.166，
                                     變化集中在箔片 bin（147.4 / 162.6 mm）

        irradiance 是**精確的全域增益**（shape delta 恰為 0），與
        signal_energy_to_mcps 完全簡併；而 _FOIL_REFLECTANCE_940NM 只縮放
        箔片那一支回波，會改變波形**形狀**，因此在原理上可與全域增益分離。
        它不屬於本組，已移出，改為獨立的 calibration-only 參數。

        **再選固定項。** 固定 irradiance = 1.0：mitsuba spot 的 intensity 單位是
        W/sr，而 SRC-HANDOFF 未回收任何 VCSEL 光功率規格，因此這個絕對值沒有
        一手來源可對；反之 signal_energy_to_mcps 的定義**就是**「模擬能量換算成
        MCPS」，任意的輻射尺度本來就該落在這個換算係數上，因為 MCPS 才是
        可觀測、可校準的那一端。把尺度留在 scenario yaml 還有一個實務風險：
        yaml 逐 run 變動，全域亮度會在 run 之間無聲漂移。
      claim_boundary: >
        lighting.irradiance = 1.0 為 **radiometric gauge**，不是 VCSEL 的實際
        光功率，**不得**被引用為感測器發射功率或任何絕對輻射量。
        校準後的 signal_energy_to_mcps 因此也是相對值，只在本 gauge 下有意義。

  - id: CG-3_ambient
    physical_quantity: Ambient Rate
    members: [lighting.irradiance, _ROOM_LIGHT_RATIO, ambient_energy_to_mcps]
    relation: Ambient ∝ irradiance × room_ratio × ambient_energy_to_mcps
    decision:
      status: BLOCKED
      decided_on: "2026-08-28"
      rationale: >
        本組的簡併結構其實可解 —— irradiance 已由 CG-2 固定，剩下
        _ROOM_LIGHT_RATIO × ambient_energy_to_mcps 是單純的兩項簡併，
        固定其一即可。**但那不是本組真正的問題。**

        問題在於要拿來校準它的那個觀測量不是 ambient。實測（probe_ambient，
        Empty 與 Water-filled，室內光比例 0.0 / 0.02 / 0.5 三點）：

          background_energy（Ambient 通道的輸入）
            室內光關閉      26408.47 (Empty)   200336.76 (Water)
            室內光 0.02     26417.22           200344.72
          -> 室內光佔比      **0.033%**          **0.004%**
          -> 雷射多重反射佔比 99.967%            99.996%

        也就是說 _ROOM_LIGHT_RATIO 對 Ambient 輸出的槓桿只有萬分之三，
        其餘全部來自感測器自己打出去的光。在這個觀測量上校準室內光比例，
        等於用一把 99.97% 是雜訊的尺去量一件事 —— 得到的數字會收斂，
        但收斂到的是多重反射的大小，不是環境光。

        這不是「證據不足」而已，是**校準目標定義錯誤**。在 Ambient 觀測量
        改正之前給任何一項數值，都是把一個無法辨識的量寫成已知。
      blocked_reason: >
        Ambient 觀測量 features.extract_observables 的
        background_energy := total - main_window 實測有 99.97% 是雷射多重反射，
        並非環境光；_ROOM_LIGHT_RATIO 在其上的槓桿僅 0.033%（見 rationale）。
      unblock_requires:
        - Ambient 觀測量重新定義為「不含 VCSEL 貢獻」的量（例如關閉 spot 的
          獨立 ambient pass；實測該 pass 總能量 Empty 14.17 / Water 12.32，
          與現行 background_energy 差 1864x / 16262x）
        - 重新量測 _ROOM_LIGHT_RATIO 對新觀測量的槓桿，確認其可辨識
        - 上述完成後本組退化為 {_ROOM_LIGHT_RATIO, ambient_energy_to_mcps}
          兩項簡併，再依 CG-2 同一套理由選定固定項
