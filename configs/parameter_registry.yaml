# PC-MEF Research System source maintenance contract
# 上下游: 由 pcmef.core.parameters 載入；被 simulation/surrogate 的 formal 防線
#         與 initial_simulation.lock 引用；parameter_set_hash 進 formal artifact。
# 檔案路徑: configs/parameter_registry.yaml
# 產生時間: 2026-08-28 01:20 +08:00
# 版本: v0.2.0
# 功能說明: 列出所有會影響 E1 四特徵（Distance / Ambient / Signal / Sigma-like）
#           的 scene、renderer 與 surrogate 參數，並逐項標記它的物理角色、
#           出處、provenance 狀態、是否可校準、允許範圍，以及是否阻擋 formal。
# 模組定位: 參數的唯一 canonical registry。它「不是」設定檔 ——
#           實際數值仍在各模組與 scenario yaml；本檔登記的是「這個數字是什麼、
#           可不可以動、動到哪裡為止」。
# 主要責任:
#   1. 讓「有幾個未校準參數」有唯一答案，不靠人工數
#   2. 標出 calibration-only nuisance 與其 allowed range
#   3. 標出彼此重複控制同一物理量的參數（confounded）
#   4. 提供 parameter_set_hash 的輸入來源
# 維護提醒:
#   - 不得在此登記一個「看起來合理」的 allowed_range 就當成已校準；
#     range 是搜尋邊界，不是值。
#   - 不得新增未登記的自由參數；calibration 期間出現新參數必須先開 amendment
#     （NOTE-028 的機制）。
#   - class_scope: class_specific 的項目必須有物理理由，不得用來偷調單類結果。
#   - 不得為了讓 formal 過關而把 PLACEHOLDER 改標 CONVENTION：CONVENTION 只在
#     「是某個 RESOLVED confounded group 的 fixed 成員、且該組寫明 claim_boundary」
#     時才被防線接受，其餘一律視為未解決（NOTE-031）。
#   - 不得在此改 value 欄來消除 live drift；drift 代表程式與登記不一致，
#     要查的是哪一邊錯（NOTE-030）。
#   - v0.1.0 新增：首版 registry，對應 NOTE-030。
#   - v0.2.0 CG-1/CG-2 裁決為 RESOLVED、CG-3 裁決為 BLOCKED；
#     _FOIL_REFLECTANCE_940NM 經實測確認可分離，移出 CG-2；
#     optical_path_to_distance 改為非 formal-blocking 的 derived；
#     fov/cutoff/foil orientation/max_depth/bounce_budget 的 source 改指
#     具名常數（NOTE-030、NOTE-033）。
# 驗證方式:
#   - py -3.10 -m pytest tests/unit/test_parameter_registry.py -v
#   - py -3.10 -m pcmef.cli params audit
# ------------------------------------------------------------

registry_version: v0.2.0

# provenance_status: CONFIRMED | FIXED_SPEC | CONVENTION | RECONSTRUCTED
#                  | PLACEHOLDER | UNKNOWN
#   只有 CONFIRMED / FIXED_SPEC 無條件可進 formal。
#   CONVENTION 是 gauge fixing（原理上不可辨識的自由度），僅在被 RESOLVED
#   confounded group 指名為 fixed 成員時才放行。
# kind: fixed | derived | calibration_only | topology
# class_scope: shared | class_specific | n/a

parameters:

  # ---- 物理常數與規格值：不可校準 ----------------------------------------
  - name: SPEED_OF_LIGHT_M_PER_S
    source: pcmef/simulation/mitransient_adapter.py
    role: 光程長換算飛行時間
    value: 299792458.0
    provenance_status: CONFIRMED
    kind: fixed
    class_scope: n/a
    formal_blocking: false

  - name: geometry.sensor_to_bottle_mm
    source: configs/simulation/*.yaml
    role: 感測器到瓶外壁的單程距離；決定最短光程
    value: 50.0
    provenance_status: CONFIRMED       # SRC-PLAN §2.1 錨點，已由真實資料佐證
    kind: fixed
    class_scope: shared
    formal_blocking: false

  - name: geometry.bottle_diameter_mm
    source: configs/simulation/*.yaml
    role: 瓶外徑
    value: 57.0
    provenance_status: CONFIRMED
    kind: fixed
    class_scope: shared
    formal_blocking: false

  - name: geometry.wall_thickness_mm
    source: configs/simulation/*.yaml
    role: 瓶壁厚度；決定殼結構的內半徑
    value: 2.0
    provenance_status: CONFIRMED
    kind: fixed
    class_scope: shared
    formal_blocking: false

  - name: geometry.lateral_offset_mm
    source: configs/simulation/*.yaml
    role: 瓶身橫向偏移；偏移量測試的自變數
    value: 0.0
    provenance_status: CONFIRMED       # 偏移錨點已實測 98.53/90.91/88.73 mm
    kind: fixed
    class_scope: shared
    formal_blocking: false

  - name: TOF_RECORDING_POINTS
    source: pcmef/core/constants.py
    role: 一筆 recording 的 measurement-time 取樣點數
    value: 500
    provenance_status: CONFIRMED       # rank-1 dataset
    kind: fixed
    class_scope: shared
    formal_blocking: false

  - name: sample_interval_s
    source: dataset payload.interval_ms（rank-1）
    role: measurement-time 取樣間隔
    value: 0.08200001312
    provenance_status: CONFIRMED
    kind: fixed
    class_scope: shared
    formal_blocking: false

  # ---- 拓樸/材質類別：由類別語意決定，非可調數值 -------------------------
  - name: _INTERIOR_BASE_IOR
    source: pcmef/simulation/mitsuba_adapter.py
    role: 瓶內基底折射率（empty/misty=air，water/bubbly=water）
    value: {empty: air, water: water, bubbly: water, misty: air}
    provenance_status: CONFIRMED       # SRC-SAI FR-002 標籤語意
    kind: topology
    class_scope: class_specific        # 有物理理由：霧在空氣中、氣泡在水中
    formal_blocking: false

  # ---- 場景 nuisance：全部未校準 -----------------------------------------
  - name: _ROOM_LIGHT_RATIO
    source: pcmef/simulation/mitsuba_adapter.py
    role: 室內環境光相對 VCSEL 的強度比；Ambient 通道的唯一來源
    value: 0.02
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0001, 1.0]
    class_scope: shared
    formal_blocking: true
    confounded_with: [lighting.irradiance, ambient_energy_to_mcps]
    note: >
      NOTE-026。**CG-3 已裁決為 BLOCKED（NOTE-032）**：實測本參數對 Ambient
      輸出的槓桿僅 0.033%（Empty）／0.004%（Water），其餘 99.97% 來自雷射
      多重反射。在 Ambient 觀測量重新定義之前不得校準本項。

  - name: _BOTTLE_SURFACE_ALPHA
    source: pcmef/simulation/mitsuba_adapter.py
    role: 瓶壁 GGX 粗糙度；決定前表面回波強度
    value: 0.02
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.001, 0.3]        # 不得為 0：會退回 delta BSDF（NOTE-027）
    class_scope: shared
    formal_blocking: true
    note: NOTE-027

  - name: _FOIL_GAP_TO_BOTTLE_RATIO
    source: pcmef/simulation/mitsuba_adapter.py
    role: 箔片與瓶外壁的間距（以瓶半徑為單位）；決定 far-side 回波位置
    value: 1.0
    provenance_status: RECONSTRUCTED   # 幾何慣例，非量測值。不得標 provenance-supported
    kind: calibration_only
    allowed_range: [0.1, 6.0]
    class_scope: shared
    formal_blocking: true
    note: NOTE-029

  - name: _FOIL_SIZE_TO_DIAMETER_RATIO
    source: pcmef/simulation/mitsuba_adapter.py
    role: 箔片邊長相對瓶徑；太小會截斷 far-side 回波
    value: 4.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [2.0, 10.0]
    class_scope: shared
    formal_blocking: true
    note: NOTE-029

  - name: _FOIL_REFLECTANCE_940NM
    source: pcmef/simulation/mitsuba_adapter.py
    role: 鋁箔在 940 nm 的有效反射率
    value: 0.85
    provenance_status: UNKNOWN         # SRC-HANDOFF §0 明列未回收
    kind: calibration_only
    allowed_range: [0.3, 0.98]
    class_scope: shared
    formal_blocking: true
    note: >
      NOTE-029。**2026-08-28 移出 CG-2**：先前被登記為與 irradiance、
      signal_energy_to_mcps「三者相乘」，實測推翻 —— 它只縮放箔片那一支回波，
      0.85->0.425 使總能量僅變為 0.983x(Empty) / 0.768x(Water)（非 0.5x），
      且正規化波形改變（L1 0.020 / 0.166），變化集中在箔片 bin
      147.4 / 162.6 mm。改變波形形狀者可與全域增益分離，故本項獨立可辨識。
      但 Empty 的槓桿明顯較弱（0.983x），可辨識性由箔片回波佔比大的類別主導，
      calibration 時須逐類檢查條件數，不得只看整體殘差。

  - name: _FOIL_SURFACE_ALPHA
    source: pcmef/simulation/mitsuba_adapter.py
    role: 箔片 GGX 粗糙度（皺褶程度）
    value: 0.15
    provenance_status: UNKNOWN
    kind: calibration_only
    allowed_range: [0.01, 0.6]
    class_scope: shared
    formal_blocking: true
    note: NOTE-029

  - name: foil_orientation
    source: pcmef/simulation/mitsuba_adapter.py:_FOIL_ORIENTATION
    role: 箔片法線方向；目前為正對相機
    value: facing_camera
    provenance_status: UNKNOWN         # SRC-HANDOFF §0 明列未回收
    kind: calibration_only
    allowed_range: null                # 類別型參數，無數值區間
    class_scope: shared
    formal_blocking: true
    note: >
      2026-08-28 已參數化為具名常數，防線攔得到（NOTE-033）。
      `_foil_transform()` 只實作 facing_camera，其餘取值一律拒絕而非退回預設 ——
      「未實作的朝向」與「刻意選了正對相機」必須分得開。
      仍為 UNKNOWN：SRC-HANDOFF §0 把箔片 orientation 列為未回收，
      正對相機是建模假設，不是量測。校準它需要先實作傾角參數化。

  - name: _SIGMA_T_REFERENCE_PER_M
    source: pcmef/simulation/mitsuba_adapter.py
    role: 無單位密度換算成消光係數 sigma_t (1/m) 的參考尺度
    value: 100.0
    provenance_status: CONVENTION      # CG-1 裁決：gauge fixing，不是量測值
    kind: fixed
    allowed_range: null                # 不再是搜尋對象；固定即定義
    class_scope: shared
    formal_blocking: false
    confounded_with: [medium.turbidity, medium.bubble_density, medium.mist_density]
    note: >
      CG-1 的固定項。與三個密度**相乘**決定 sigma_t，只有乘積可辨識，
      因此本項沒有物理真值可求 —— 固定它是選座標系，不是宣稱知道它。
      claim boundary 見 confounded_groups.CG-1_extinction：
      校準後的三個密度不得被解讀為絕對濁度／密度。

  - name: _ALBEDO_BY_PRESET
    source: pcmef/simulation/mitsuba_adapter.py
    role: 各類介質的單次散射反照率
    value: {water: 0.60, bubbly: 0.92, misty: 0.88}
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 1.0]
    class_scope: class_specific        # 物理上合理，但每一類各自可調 -> 高洩漏風險
    formal_blocking: true
    note: 三個獨立自由度。calibration 時須有共用先驗或明確理由，不得逐類貼合

  - name: medium.turbidity
    source: configs/simulation/*.yaml（Water-filled）
    role: 水的濁度；乘上 _SIGMA_T_REFERENCE_PER_M 得 sigma_t
    value: 0.05
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 2.0]
    class_scope: class_specific
    formal_blocking: true
    confounded_with: [_SIGMA_T_REFERENCE_PER_M]

  - name: medium.bubble_density
    source: configs/simulation/*.yaml（Bubbly）
    role: 氣泡密度
    value: 0.30
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 2.0]
    class_scope: class_specific
    formal_blocking: true
    confounded_with: [_SIGMA_T_REFERENCE_PER_M]

  - name: medium.mist_density
    source: configs/simulation/*.yaml（Misty）
    role: 氣霧密度
    value: 0.15
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 2.0]
    class_scope: class_specific
    formal_blocking: true
    confounded_with: [_SIGMA_T_REFERENCE_PER_M]

  - name: lighting.irradiance
    source: configs/simulation/*.yaml
    role: VCSEL 發射強度；同時被 _ROOM_LIGHT_RATIO 乘用
    value: 1.0
    provenance_status: CONVENTION      # CG-2 裁決：radiometric gauge
    kind: fixed
    allowed_range: null
    class_scope: shared
    formal_blocking: false
    confounded_with: [_ROOM_LIGHT_RATIO, signal_energy_to_mcps]
    note: >
      CG-2 的固定項。實測 irradiance 1.0->2.0 使能量恰為 2.0000 倍且正規化
      波形逐 bin 差為 **0.0** —— 與 signal_energy_to_mcps 精確簡併，
      波形中不存在任何能分辨兩者的資訊。SRC-HANDOFF 未回收 VCSEL 光功率，
      因此此值不得被引用為實際發射功率。

  # ---- Renderer / 時間窗 ---------------------------------------------------
  - name: _LEADING_MARGIN_BINS
    source: pcmef/simulation/mitransient_adapter.py
    role: 時間窗起點保留給首回波前緣的 bin 數
    value: 8
    provenance_status: RECONSTRUCTED   # 由「足以解析上升緣」推得的下界，非量測
    kind: calibration_only
    allowed_range: [2, 32]
    class_scope: shared
    formal_blocking: true
    note: NOTE-027

  - name: bounce_budget
    source: pcmef/simulation/mitransient_adapter.py:_DEFAULT_BOUNCE_BUDGET
    role: 時間窗尾端 = shortest + bounce_budget * extent
    value: 3.0
    provenance_status: RECONSTRUCTED   # 由實測能量末端 0.646 m 推得
    kind: calibration_only
    allowed_range: [1.5, 10.0]
    class_scope: shared
    formal_blocking: true
    note: NOTE-027。改場景後須重新量測末端能量再定

  - name: max_depth
    source: pcmef/simulation/mitsuba_adapter.py:_MAX_DEPTH
    role: path tracer 最大反射深度；決定哪些 path family 進得了 transient
    value: 12
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [8, 32]
    class_scope: shared
    formal_blocking: true
    note: >
      實測 far-side 箔片回波需要 max_depth >= 12 才出現（NOTE-029 lineage）。
      設太低會靜默丟失整個 path family，且不會有任何錯誤訊息。

  - name: temporal_bins
    source: configs/simulation/*.yaml
    role: transient 時間軸解析度
    value: 128
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [64, 1024]
    class_scope: shared
    formal_blocking: true

  - name: spp
    source: configs/simulation/*.yaml
    role: 每像素取樣數；決定 Monte Carlo 雜訊水準
    value: 16
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [16, 4096]
    class_scope: shared
    formal_blocking: true
    note: smoke 用 16；formal 必須遠高於此，否則雜訊會被誤認為訊號結構

  - name: resolution
    source: configs/simulation/*.yaml
    role: film 解析度；影響 FoV 內的空間取樣
    value: [64, 64]
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: null
    class_scope: shared
    formal_blocking: true

  - name: sensor.fov_deg
    source: pcmef/simulation/mitsuba_adapter.py:_SENSOR_FOV_DEG
    role: 接收端視角；決定哪些回波被收集
    value: 45.0
    provenance_status: UNKNOWN
    kind: calibration_only
    allowed_range: [10.0, 60.0]
    class_scope: shared
    formal_blocking: true
    note: >
      **角度慣例已由實測確定：這是全角。** mitsuba perspective 的 fov 預設綁 x 軸，
      實測 fov=45 -> 單邊半角 22.4959 度、畫面對角 30.3562 度（NOTE-033）。
      **不得逕自改成 25。** 兩個理由：
      (a) VL53L0X 的 25 度規格值屬 full-cone 或 half-angle，本 repo 無一手來源
          （SRC-PLAN / SRC-HANDOFF 皆未記載），對比 45 是拿定義不明的數字比；
      (b) 本模擬的接收端是 64x64 perspective film，不是單一 SPAD 的圓錐視野，
          方形視野的角落（30.36 度）本來就超出同名的圓錐半角。
      解除阻塞需要：取得 ST 資料手冊對 25 度的定義，並裁決方形 film 與
      圓錐 FoV 之間的對應方式。

  - name: light.cutoff_angle_deg
    source: pcmef/simulation/mitsuba_adapter.py:_LIGHT_CUTOFF_ANGLE_DEG
    role: VCSEL 發散角
    value: 25.0
    provenance_status: UNKNOWN
    kind: calibration_only
    allowed_range: [5.0, 45.0]
    class_scope: shared
    formal_blocking: true
    note: >
      **角度慣例已由實測確定：這是半角。** cutoff_angle=25 時，離軸 24.9 度仍有
      輻射、25.1 度為 0，故照明錐為 **50 度全角**（NOTE-033）。
      同一個檔案裡 fov 的 45 是全角、本項的 25 是半角 —— 兩個角度用了相反的
      慣例。因此「光源 25 度比感測器 45 度窄」是錯覺：實際上照明錐(50 度全角)
      **比接收視野(45 度全角)寬**。這會影響哪些回波被收集，calibration 前必須
      先裁決兩者的相對關係。

  # ---- Surrogate 校準常數（calibration.py 的九個）-------------------------
  - name: optical_path_to_distance
    source: pcmef/surrogate/calibration.py
    role: 光程長換算單程距離
    value: 0.5
    provenance_status: CONFIRMED       # monostatic 幾何使其為 0.5（NOTE-026）
    kind: derived
    class_scope: shared
    formal_blocking: false
    note: >
      由共置（monostatic）幾何決定：光程恰為單程距離的兩倍，故係數為 0.5。
      **不是自由參數，不得進 calibration 搜尋集合。**
      2026-08-28 已在 calibration.py 落實：改標 derived=True、placeholder=False，
      並由 SurrogateCalibration.with_calibrated() 拒絕覆寫（NOTE-030）。
      改動它等於改動幾何假設，必須先改場景再改這裡。

  - name: distance_offset_mm
    source: pcmef/surrogate/calibration.py
    role: 距離系統偏移
    value: 0.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [-20.0, 20.0]
    class_scope: shared
    formal_blocking: true

  - name: signal_energy_to_mcps
    source: pcmef/surrogate/calibration.py
    role: transient 能量換算 Signal Rate (MCPS)
    value: 1.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [1.0e-6, 1.0e6]
    class_scope: shared
    formal_blocking: true
    confounded_with: [lighting.irradiance]

  - name: ambient_energy_to_mcps
    source: pcmef/surrogate/calibration.py
    role: 背景能量換算 Ambient Rate (MCPS)
    value: 1.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [1.0e-6, 1.0e6]
    class_scope: shared
    formal_blocking: true
    confounded_with: [_ROOM_LIGHT_RATIO, lighting.irradiance]
    note: >
      **CG-3 BLOCKED（NOTE-032）。** 本係數的輸入 background_energy 實測
      99.97% 是雷射多重反射而非環境光，校準它會把多重反射的大小寫成
      環境光速率。須先修正 Ambient 觀測量定義。

  - name: sigma_width_to_mm
    source: pcmef/surrogate/calibration.py
    role: 回波寬度換算 Sigma-like (mm)
    value: 1.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [1.0e-6, 1.0e6]
    class_scope: shared
    formal_blocking: true

  - name: sigma_snr_weight
    source: pcmef/surrogate/calibration.py
    role: SNR 對 Sigma-like 的權重
    value: 1.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 100.0]
    class_scope: shared
    formal_blocking: true

  - name: sigma_multipath_weight
    source: pcmef/surrogate/calibration.py
    role: 多路徑突起度對 Sigma-like 的權重
    value: 1.0
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 100.0]
    class_scope: shared
    formal_blocking: true

  - name: noise_relative_sigma
    source: pcmef/surrogate/calibration.py
    role: 觀測雜訊的相對標準差
    value: 0.01
    provenance_status: PLACEHOLDER
    kind: calibration_only
    allowed_range: [0.0, 0.5]
    class_scope: shared
