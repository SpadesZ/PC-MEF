# 產生時間: 2026-08-30 03:10 +08:00
# 版本: v0.1.0
# 功能說明: 記錄 stage 0 首次實測後暴露的五項 pre-execution 缺陷、各自的裁決，
#           以及 CG-5 這組新簡併的 gauge 選擇與其 claim boundary。
# 模組定位: AMD-004 的**輸入規格**。凍結後的權威記錄是
#           freeze/amendments/AMD-004.amendment.json；本檔留在版控是為了
#           讓修訂內容可被 review，而不是被 CLI 參數帶過。
# 主要責任:
#   1. 逐項寫出被修改的契約（before / after）
#   2. 記下修訂當下的前提證據，特別是兩個 access count 與 stage 0 未凍結
#   3. 說明 CG-5 為何固定 albedo 而非固定密度，以及由此產生的 claim boundary
#   4. 列出本次修訂**沒有**改變的不變式
# 維護提醒:
#   - 不得在 AMD-004 凍結後修改本檔；要再改就開 AMD-005。
#   - 不得把 precondition_evidence 的 access count 寫成「應該是 0」；
#     那兩個數字必須是凍結當下實際讀到的值，它們是本記錄唯一能證明
#     「不是看到擬合結果才改規則」的東西。
#   - 不得藉本修訂放寬 initial_simulation.lock 的 parameter_ranges；
#     可行域是**導出的子集**，凍結的登記範圍一個位元都不動。
#   - v0.1.0 新增：首版（NOTE-044）。
