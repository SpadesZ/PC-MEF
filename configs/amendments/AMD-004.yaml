amendment_id: AMD-004
title: >
  Reorder the calibration stages so that physical scene and media are fitted
  before any measurement mapping is frozen; scope admission and collinearity
  to each stage's own declared observables; rule CG-5 (density/albedo) and
  CG-6 (three-way angular/surface response); add a parameter-agnostic
  conservative borderline rule and zero-dimensional stage semantics; replace
  the sigma_MC-zero and infeasible-bound cases with deterministic
  preregistered branches; and replace the wall-clock estimate, measured to be
  understated 30-42x, with a cost-model formula that is not itself binding

supersedes: >
  configs/calibration_preregistration.yaml v0.2.0
  (protocol hash c6a0de86e866cc0dbd426e77fe407d9659f46fc8888f2955e02820abd6a2316d,
  frozen as CAL-PREREG-002 record hash
  e7e2a298cfa364eb210ac56a414d72183e33a7f4b6974867fe06cb20482db99e)

authority: >
  researcher decision under the preregistration's own amendment clause, taken
  after stage 0 was executed as a simulation-only probe and before any
  calibration partition value was read. Stage 0 was NOT frozen: its outcome
  was STAGE0_ADJUDICATION_REQUIRED, which is the state this amendment
  adjudicates.

changed_contracts:

  calibration_preregistration.stagewise.order:
    before: >
      1 AMBIENT (mapping) -> 2 SIGNAL_SCALE (mapping) ->
      3 GEOMETRY_SURFACE_FOIL (scene) -> 4 PARTICIPATING_MEDIA (scene) ->
      5 SENSOR_SURROGATE (mapping). Stage 1's why_first claimed the Ambient
      stage "has no parameter in common with the other four stages, so doing
      it first cannot be overturned later".
    after: >
      1 SCENE_GEOMETRY_SURFACE_FOIL -> 2 SCENE_PARTICIPATING_MEDIA ->
      3 MAPPING_AMBIENT -> 4 MAPPING_SIGNAL -> 5 MAPPING_SIGMA.
      Governing principle: physical scene and media first, final measurement
      mappings last. A mapping gain may not be fitted and frozen while a
      later stage can still move the observable it was fitted against.

  calibration_preregistration.stagewise.AMBIENT.identifiability:
    before: >
      "Ambient is obtained only from the AMBIENT_ONLY pass (VCSEL off,
      NOTE-034), therefore it is independent of ANY parameter of the active
      pass." Evidence cited: irradiance 1.0 -> 4.0 leaves ambient at
      3.603355 -> 3.603355.
    after: >
      The claim is corrected to its measured scope: Ambient is independent of
      the VCSEL EMISSION PARAMETERS, not of the scene. The AMBIENT_ONLY pass
      keeps the identical geometry, so the room light illuminates the same
      foil, bottle wall and participating media. Measured in stage 0 at the
      frozen settings, scene and media parameters move the ambient channel by
      69-129 sigma_MC, which is LARGER than their effect on any other channel:
      _FOIL_SURFACE_ALPHA 112.3, _FOIL_SIZE_TO_DIAMETER_RATIO 101.7,
      _FOIL_REFLECTANCE_940NM 69.43, _FOIL_GAP_TO_BOTTLE_RATIO 108.7,
      medium.bubble_density 129.1, medium.turbidity 93.56,
      medium.mist_density 92.33. Fitting and freezing the ambient mapping
      first therefore pins a gain against an observable that stages 1-2 then
      move by up to two orders of magnitude of its own noise floor.

  calibration_preregistration.stagewise.SIGNAL_SCALE.identifiability:
    before: >
      signal_energy_to_mcps is a post-hoc unit conversion applied after the
      estimator, so it is determined by the class-pooled signal location.
      Only the three foil amplitude parameters were named as an approximate
      residual confound.
    after: >
      Audited in stage 0 as required. The Signal channel is affected by later
      scene parameters at least as strongly as Ambient, and the effect was
      previously invisible because it is expressed relative to an enormous
      Monte-Carlo noise floor. Measured RELATIVE shift of the signal median
      across the registered range: sensor.fov_deg 1349.7%,
      medium.bubble_density 1119.1%, _FOIL_GAP_TO_BOTTLE_RATIO 330.8%,
      light.cutoff_angle_deg 191.4%, medium.turbidity 171.5%,
      _FOIL_SURFACE_ALPHA 91.3%, _FOIL_REFLECTANCE_940NM 85.9%. The same
      sweeps score only 0.0006-16.6 in sigma_MC units because
      sigma_MC/|value| for signal_rate_mcps is 0.35-1.25 at the frozen
      spp = 16, versus 4.6e-4 for distance_mm and about 1.1e-2 for
      ambient_rate_mcps. Conclusion: the Signal mapping must also be fitted
      last, and the signal channel's noise floor is recorded as an open
      finding (see evaluation_budget.wall_clock).

  calibration_preregistration.stage_0.admission_threshold.scope:
    before: >
      max over EVERY observable: max_o leverage_sim(p, o) >= K admits p.
    after: >
      max over the observables that p's OWN STAGE declares it optimises.
      Both numbers are recorded (max_leverage and max_leverage_declared).
      Reason: under the previous rule a parameter could be admitted on the
      strength of a channel its stage never minimises. Measured example at
      the frozen settings: _FOIL_SIZE_TO_DIAMETER_RATIO was ADMITTED at
      leverage 101.7 via Water-filled ambient, while its leverage on stage 3's
      own declared channels (Empty distance / signal / sigma_like) is 0.0006.
      Admitting it would have put a parameter into a stage whose objective
      terms cannot see it -- exactly the "fitted value decided by noise"
      failure stage 0 exists to prevent.

  calibration_preregistration.forbidden_parameters.gauge_fixed.CG-5:
    before: >
      (did not exist) The registry's CG-1..CG-4 do not cover the relationship
      between each class's extinction density and its single-scattering
      albedo. CAL-PREREG-002 stage 4 argued only that the three CLASSES do not
      cross-couple; it made no claim that density and albedo are separable
      WITHIN a class.
    after: >
      New confounded group CG-5_effective_medium. Measured within-stage
      cosine of the sigma_MC-normalised response vectors at the frozen
      settings: medium.bubble_density <-> _ALBEDO_BY_PRESET.bubbly 0.9995,
      medium.turbidity <-> _ALBEDO_BY_PRESET.water 0.9987,
      medium.mist_density <-> _ALBEDO_BY_PRESET.misty 0.9980; all three
      exceed the preregistered 0.98 threshold. Ruling, by the same rule used
      for CG-1 and CG-2 (fix the member with the weaker provenance, not the
      one that fits better): the three albedos are fixed as CONVENTION at
      their frozen initial values (water 0.60, bubbly 0.92, misty 0.88) and
      the three densities are fitted. Together with CG-6 this reduces the
      CANDIDATE search space from 20 to 15 dimensions; the ADMITTED set is not
      fixed here and must come from the CAL-PREREG-003 stage 0 rerun.
      CLAIM BOUNDARY: a fitted density may only be reported as an
      EFFECTIVE-MEDIUM extinction parameter of the calibrated simulator. It
      may not be reported as a true absolute concentration, turbidity or
      number density, because the value absorbs whatever the fixed albedo got
      wrong. This mirrors the CG-1 boundary, under which only sigma_t is
      claimable.

  calibration_preregistration.stage_0.collinearity_check.scope:
    before: >
      Pairwise cosine over ALL 20 optimizer dimensions within a stage, using
      response vectors spanning all 32 observables, with every pair whose
      |cos| >= 0.98 raising a formal confounding blocker regardless of whether
      either member was actually going to be fitted.
    after: >
      The collinearity blocker is computed ONLY over pairs that are
      (a) in the same stage, AND
      (b) still ADMITTED or ADMITTED_DETERMINISTIC after own-stage admission.
      The response vector uses ONLY that stage's declared observables,
      component-wise normalised by sigma_MC.
      A GAUGE_FIXED or NOT_ADMITTED member can NEVER form a formal confounding
      blocker.
      Reason: a degeneracy is a statement about the optimizer's search space.
      A parameter that is gauge-fixed is not in that space, so it cannot be
      confounded with anything -- reporting it as a blocker would demand a
      ruling about two quantities that are never fitted together. Restricting
      the vector to the stage's own channels follows for the same reason: the
      objective the stage minimises is the only thing that can fail to
      separate them.

  calibration_preregistration.forbidden_parameters.gauge_fixed.CG-6:
    before: >
      (did not exist) _BOTTLE_SURFACE_ALPHA and light.cutoff_angle_deg were
      measured at |cos| 0.9948 under the old global scope, and an earlier draft
      of this amendment ruled only on that PAIR, keeping light.cutoff_angle_deg
      fitted.
    after: >
      New confounded group CG-6_effective_angular_response, and it is a
      THREE-WAY degeneracy, not a pair. Projected over the six Empty
      observables that SCENE_GEOMETRY_SURFACE_FOIL declares:
        _BOTTLE_SURFACE_ALPHA <-> light.cutoff_angle_deg  1.0000
        _BOTTLE_SURFACE_ALPHA <-> sensor.fov_deg          0.9998
        light.cutoff_angle_deg <-> sensor.fov_deg         0.9998
      Ruling: fix BOTH _BOTTLE_SURFACE_ALPHA = 0.02 AND
      light.cutoff_angle_deg = 25.0 as CONVENTION; sensor.fov_deg is the sole
      calibrated member.
      Provenance basis, not fit quality: the VL53L0X datasheet carries an
      external specification for system FoV, whereas the true VCSEL divergence
      and the bottle-surface GGX roughness have none. The weaker-provenance
      members are fixed. Note the simulator's sensor.fov_deg is a SQUARE
      perspective-film FULL angle and must not be treated as equivalent to the
      real system FoV, and light.cutoff_angle_deg is a HALF-angle simulator
      convention.
      CLAIM BOUNDARY: a fitted sensor.fov_deg may only be reported as an
      EFFECTIVE COLLECTION-ANGLE PARAMETER OF THE SQUARE-FILM RECEIVER
      SURROGATE. It may NOT be reported as the true or measured VL53L0X system
      FoV, because it absorbs whatever the two fixed members got wrong.
      It is also FORBIDDEN to simply set sensor.fov_deg = 25 and rewrite
      initial_simulation.lock on the strength of the datasheet.
  calibration_preregistration.stage_0.borderline_policy:
    before: >
      A parameter whose leverage fell inside the borderline band [5, 20]
      halted the flow with STAGE0_ADJUDICATION_REQUIRED and had no resolution
      rule, so every borderline parameter invited a bespoke ruling made after
      its number was already known.
    after: >
      A protocol-level, PARAMETER-AGNOSTIC conservative rule. If a parameter's
      own-stage leverage lands in the band and no NAMED secondary adjudication
      rule existed for it before this amendment, the outcome is
      GAUGE_FIXED_AT_FROZEN_INITIAL_VALUE. Inventing a rescue criterion for an
      individual borderline parameter is forbidden.
      The ONLY named exception is MAPPING_SIGMA.sigma_snr_weight, for which
      S0-B1..B5 was defined in advance and must be executed.
      BORDERLINE therefore ceases to be a blocker; only a parameter still
      awaiting its named secondary criterion, or one whose secondary criterion
      was not executed in full (SECONDARY_INCOMPLETE), remains unresolved.

  calibration_preregistration.stagewise.zero_dimensional_stage:
    before: >
      (did not exist) A stage left with no admitted parameter had no defined
      semantics, so it would have been either an error or a silent skip.
    after: >
      A stage with no admitted parameter is a NAMED, LEGAL terminal state:
        status = NO_FREE_PARAMETERS
        optimizer_run = false
        physical model retained = true
        values = frozen initial values
        reason = failed preregistered identifiability admission
      It is neither an error nor a silent skip, and the rule applies to any
      zero-dimensional stage. Loosening the admission threshold so that a
      stage "has something to do" is forbidden.

  calibration_preregistration.stage_0.sigma_mc_degeneracy:
    before: >
      sigma_MC <= 0 made the leverage "undefined" and the parameter
      UNDETERMINED. One branch covered two opposite situations.
    after: >
      Three deterministic branches with a preregistered relative floor
      SIGMA_MC_RELATIVE_FLOOR = 1e-12 applied to the observable's own scale:
        RATIO                  sigma_MC > floor            -> |delta o| / sigma_MC
        INERT                  sigma_MC <= floor and |delta o| <= floor -> exactly 0.0
        DETERMINISTIC_RESPONSE sigma_MC <= floor and |delta o| >  floor -> named
                               branch, outcome ADMITTED_DETERMINISTIC
      No branch returns infinity and none invents a large number. INERT means
      the observable carries no information about the parameter, which is a
      leverage of exactly zero, not an unknown. DETERMINISTIC_RESPONSE means a
      noiseless observable that nevertheless moves, which is the strongest
      possible identifiability evidence and is recorded under its own name so
      it can be reviewed rather than hidden inside an infinity.

  surrogate.ambient.map_ambient_rate.jitter_domain:
    before: >
      `if jitter <= 0: raise CalibrationError(...)`, justified as SRC-SAI §10's
      ban on a constant per-class ambient rate.
    after: >
      `if jitter < 0: raise`. Zero jitter is permitted and is exactly
      deterministic; it also consumes no random draw, so common random numbers
      remain aligned between jitter = 0 and jitter > 0.
      Reason: 0.0 is the LOWER BOUND of the frozen registered range
      [0.0, 0.5] in initial_simulation.lock, and parameter_ranges sits inside
      the errata forbidden zone. The assertion therefore made stage 0
      incapable, in principle, of evaluating a bound that cannot be changed.
      The original concern is not discarded: a constant ambient rate is now
      excluded by the objective itself, since J compares whole distributions
      by W1 and the real Ambient has non-zero dispersion, so jitter -> 0
      increases the ambient terms and the optimizer rejects it. A distribution
      distance is a more precise guard than an assertion that also blocks a
      legal bound.

  calibration_preregistration.bounds.physical_feasibility:
    before: >
      (did not exist) out_of_bounds_policy covered points OUTSIDE the
      registered range. Nothing covered a registered bound at which the
      simulator cannot produce a physically admissible result.
    after: >
      A preregistered, simulation-only feasibility rule. A value is FEASIBLE
      when all four classes, at the frozen initial scene and the frozen CRN
      seeds, produce finite and physically admissible observables. The
      CALIBRATION FEASIBLE DOMAIN of a parameter is derived by bisection from
      the frozen initial value towards the offending bound, with fixed
      settings (20 steps, relative tolerance 1e-3), always taking the feasible
      side. The derived domain is by construction a SUBSET of the registered
      range; the frozen parameter_ranges are not modified, and hand-narrowing
      or clamping remains forbidden. Measured trigger at the frozen settings:
      noise_relative_sigma at its upper bound 0.5 drives the distance mapping
      to -4.915 mm, which map_distance correctly refuses.

  calibration_preregistration.stagewise.MAPPING_SIGMA.sigma_snr_weight:
    before: >
      (did not exist) sigma_snr_weight measured leverage 17.16, inside the
      preregistered borderline band [5, 20], and CAL-PREREG-002 offers no
      resolution other than halting.
    after: >
      A SECONDARY CRITERION, preregistered here BEFORE it is run and
      simulation-only, decides borderline members of the sigma stage. It is
      recorded as a fixed conjunction so that a known borderline value cannot
      be waved through:
        S0-B1 channel dominance   the parameter's largest leverage must fall
                                  on a sigma_like observable
        S0-B2 monotonicity        the observable response must be monotone
                                  across five equally spaced points spanning
                                  the registered range
        S0-B3 seed stability      the sign and order of magnitude of the
                                  response must hold on the independent
                                  verification seed set {2001, 2002, 2042, 2004}
        S0-B4 collinearity        |cos| with every other admitted sigma-stage
                                  parameter must be below 0.98
        S0-B5 no unphysical side effect
                                  no evaluation on the five-point grid may
                                  produce a negative or non-finite observable
      ADMIT only if S0-B1..S0-B5 all pass; otherwise GAUGE_FIX. The measured
      value 17.16 is explicitly NOT a reason to admit, and the criterion may
      not be edited after it has been run.
      NO SEPARATE CG RULING IS TAKEN FOR sigma_snr_weight: S0-B4 already
      decides it. Projected from the frozen CAL-PREREG-002 artifact over the
      eight sigma_like observables the sigma stage declares,
      |cos|(sigma_snr_weight, sigma_multipath_weight) = 0.9959 >= 0.98 while
      |cos|(sigma_snr_weight, sigma_width_to_mm) = 0.9503, so S0-B4 fails
      against an admitted member and the preregistered consequence is an
      AUTOMATIC GAUGE_FIX. The binding value is the one the CAL-PREREG-003
      re-run produces, not this projection.

  calibration_preregistration.stage_0.foil_group:
    before: >
      Three foil parameters were mutually collinear under the old global scope
      (_FOIL_REFLECTANCE_940NM <-> _FOIL_SURFACE_ALPHA 0.9986,
       _FOIL_SIZE_TO_DIAMETER_RATIO <-> _FOIL_SURFACE_ALPHA 0.9959,
       _FOIL_REFLECTANCE_940NM <-> _FOIL_SIZE_TO_DIAMETER_RATIO 0.9945),
      which would have demanded a gauge ruling.
    after: >
      NO RULING IS TAKEN, and none is needed. Under own-stage admission,
      projected over the six Empty observables that
      SCENE_GEOMETRY_SURFACE_FOIL declares:
        _FOIL_REFLECTANCE_940NM       0.9065     -> GAUGE_FIXED
        _FOIL_SIZE_TO_DIAMETER_RATIO  0.0005576  -> GAUGE_FIXED
        _FOIL_SURFACE_ALPHA           0.5751     -> GAUGE_FIXED
        _FOIL_GAP_TO_BOTTLE_RATIO     10.64      -> BORDERLINE -> conservative
                                                    gauge-fix by the generic rule
      With no admitted member left, the admitted-only collinearity scope
      removes all three foil degeneracies as formal blockers. They remain
      CANDIDATE parameters in CAL-PREREG-003; whether they are admitted is
      decided by the rerun, not by this projection.

  calibration_preregistration.evaluation_budget.wall_clock:
    before: >
      "about 2 seconds per evaluation (64x64, spp=16, 128 bins, four classes,
      two passes each)", giving about 65 hours single-threaded for the
      116,352 evaluations that AMD-003 derived.
    after: >
      RECORDED AS AN OPEN FINDING, NOT SILENTLY FIXED. Measured on this
      machine at exactly the frozen settings: one four-class evaluation costs
      60.8 s in an isolated probe, and 84 s averaged over the 140 scenario
      renders of the stage 0 run. The stated 2 s is therefore understated by
      about 30x, and the real single-threaded cost of the frozen budget is
      about 1,970 hours (82 days), not 65 hours. This amendment does NOT
      change spp, maxiter, popsize or restarts to make the number smaller:
      that would be choosing the experiment's resolution to fit the schedule.
      It is registered as a named blocker that must be resolved by an explicit
      decision before stage 1 begins.

rationale: >
  ## Why the stage order had to change before any real data was read

  CAL-PREREG-002 ordered the stages so that the two cheapest, most obviously
  identifiable mappings came first. The justification was structural: stage 1
  claimed Ambient is "independent of any parameter of the active pass",
  supported by a measurement in which the VCSEL power was changed by 4x and
  the ambient reading did not move at all.

  That measurement is correct and it proves what it was designed to prove:
  Ambient does not depend on the VCSEL. It does not, however, prove the
  much broader claim that was written down, because the AMBIENT_ONLY pass is
  the SAME SCENE with a different light source. Room light still reaches the
  sensor by reflecting off the foil, the bottle wall and the participating
  medium. Every geometry and media parameter therefore moves Ambient.

  Stage 0 measured exactly how much, in units of the simulator's own
  seed-to-seed noise: 69 to 129 sigma_MC. For most of those parameters the
  ambient channel is the LARGEST response they have. Under the old order,
  stage 1 would have fitted ambient_energy_to_mcps against that channel and
  frozen it, and stages 3 and 4 would then have moved the same channel by up
  to 129 noise units. The regression guard would eventually have flagged
  SIDE_EFFECT_REGRESSION, but only after stage 3 had spent 38,784 evaluations,
  and the recorded conclusion would have been "the scene stage broke the
  ambient fit" rather than "the ordering was wrong".

  The audit that this amendment required for the Signal channel found the same
  disease with an additional complication. In relative terms the scene moves
  Signal far more violently than it moves Ambient -- up to 1350% across a
  registered range -- but in sigma_MC units it looks negligible, because the
  Signal observable's own Monte-Carlo noise floor at spp = 16 is 35% to 125%
  of its value. Both facts matter and both are recorded: the ordering fix is
  necessary, and the Signal channel is close to unusable at the frozen
  sampling density.

  The new order follows one principle: physical scene and media first, final
  measurement mappings last. A mapping gain is fitted only once nothing
  downstream can still move the observable it was fitted against.

  ## Why the admission rule now uses the stage's own declared observables

  The previous rule -- max over every observable -- is what let
  _FOIL_SIZE_TO_DIAMETER_RATIO pass at 101.7 on a channel (Water-filled
  ambient) that its stage never optimises, while scoring 0.0006 on the
  channels it does. Admission is a statement about whether the optimizer can
  see a parameter; the optimizer only sees the terms in that stage's
  objective. Both numbers are still recorded, so the previous rule's verdict
  remains auditable.

  ## Why CG-5 fixes the albedo and fits the density

  The three pairs are near-exactly degenerate (0.9980 to 0.9995), so one
  member of each pair must be fixed. The choice is made on provenance, not on
  which one fits better, exactly as in CG-1 and CG-2.

  The single-scattering albedo values in the registry (0.60 / 0.92 / 0.88) are
  RECONSTRUCTED modelling assumptions with no first-hand source: nothing in
  SRC-PLAN or SRC-HANDOFF records the albedo of the water, bubble or mist
  preparations that produced this dataset. The densities are at least tied to
  a physically meaningful quantity through CG-1's already-fixed reference
  scale _SIGMA_T_REFERENCE_PER_M, and SRC-SAI §9 explicitly lists them as
  <validation-frozen range>, i.e. as quantities validation is supposed to
  determine. Fixing the quantity with no provenance and fitting the quantity
  the specification expects to be determined is the same ruling CG-1 made.

  The cost is stated as a claim boundary rather than left implicit: a fitted
  density absorbs the error in the fixed albedo, so it is an effective-medium
  extinction parameter of the calibrated simulator and nothing more. Reporting
  it as a real concentration would be the same overreach that the CG-1
  boundary already forbids for absolute turbidity.

  Reversing this ruling requires identifiability evidence -- a measurement
  showing an observable that separates density from albedo -- not a preference.

  ## Why sigma_MC = 0 now has three branches instead of one

  The single "undefined" branch conflated two opposite situations. An
  observable with no noise and no response tells you nothing about the
  parameter; its leverage is exactly zero and calling that "unknown" would
  halt the flow for a case that is fully determined. An observable with no
  noise that nevertheless moves is a perfect signal-to-noise ratio; calling
  that "unknown" throws away the strongest evidence available. Neither may be
  written as infinity, which is why the second case is a named outcome rather
  than a number. The floor is relative to the observable's own scale so that
  one rule covers channels measured in mm and in MCPS.

  ## Why the wall-clock finding is recorded rather than fixed

  AMD-003 corrected the evaluation COUNT and left the per-evaluation COST as
  a stated estimate of 2 seconds. Measurement puts it at 61-84 seconds, so
  the frozen budget is roughly 82 days rather than 65 hours. The tempting
  repair is to lower spp, maxiter or restarts until the number looks
  acceptable, but every one of those choices changes the experiment's
  resolution or its search thoroughness, and choosing them by reference to a
  schedule is not a scientific argument. It is therefore registered as a named
  blocker for stage 1 and left for an explicit decision.

  calibration_preregistration.stage_0.foil_group:
    before: >
      Three foil parameters were mutually collinear under the old global scope
      (_FOIL_REFLECTANCE_940NM <-> _FOIL_SURFACE_ALPHA 0.9986,
       _FOIL_SIZE_TO_DIAMETER_RATIO <-> _FOIL_SURFACE_ALPHA 0.9959,
       _FOIL_REFLECTANCE_940NM <-> _FOIL_SIZE_TO_DIAMETER_RATIO 0.9945),
      which would have demanded a gauge ruling.
    after: >
      NO RULING IS TAKEN, because under own-stage admission there is nothing
      left to rule on. Projected from the frozen CAL-PREREG-002 artifact,
      restricted to the six Empty observables that
      SCENE_GEOMETRY_SURFACE_FOIL declares:
        _FOIL_REFLECTANCE_940NM       0.9065     -> GAUGE_FIXED
