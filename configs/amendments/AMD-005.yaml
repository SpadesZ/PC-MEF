    by any calibration stage. heldout_access_count remains 0 until the
    calibrated simulator and all gate rules are frozen.
  frozen_scale_unchanged: >
    CAL-SF-001 (payload hash
    8e71171c7ae851c1e575627a78ac107b626f7c228895125b07b864454ee0096e) is not
    recomputed. s_f stays exactly as frozen.
  calibration_data_unchanged: >
    raw_calibration_data_hash stays
    926eef729eb3b5b4762fe7a77c139f5ca89375a57367de432508dfa8a8ca1ed8 and is
    re-asserted on every load.
  bounds_unchanged: >
    initial_simulation.lock parameter_ranges and the derived feasible domains
    are untouched; bounds_resolution_hash stays
    de9ce5a2f009e08afc916208f6dd9ee4880a84bed0919dd5d9fb290f1dea9aeb.
  stage0_admission_unchanged: >
    CAL-STAGE0-001 is not re-run and not re-adjudicated. The seven admitted
