  guard_authority_unchanged: >
    verification_tolerance stays 0.10 and regression_tolerance stays 0.10. The
    guards still fire on exactly the same evidence; only the consequence of
    firing changed.

authority: >
  Advisor decision, 2026-08-30, recorded by the maintainer. The thesis is the
  deliverable and a protected final test is the appropriate standard for it.
  This amendment is written and frozen while heldout_access_count is 0, which
  is the only thing that makes the protected-final-test claim checkable.
