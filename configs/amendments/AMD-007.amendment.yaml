#         凍結後才會產生 freeze/amendments/AMD-007.amendment.json，
#         並據以重凍 llm_runtime 與 formal_config。
# 檔案路徑: configs/amendments/AMD-007.amendment.yaml
# 產生時間: 2026-09-02 01:30 +08:00
# 版本: v0.1.0
# 功能說明: 記錄 evidence 契約更換（channel-preserving ToF + 角色最小隔離）
#           造成的 LLM runtime identity 變更，以及它發生在 Formal E2 開啟之前。
# 模組定位: operational/evidence amendment 的草稿。它「不是」已生效的記錄 ——
#           spec 進版控代表決策內容公開可稽核，凍結才代表承諾。
# 主要責任:
#   1. 記錄 ToF summary v2 與 role_evidence_contract_v2 的變更與理由
#   2. 記錄多 key 綁定與 timeout 變更對 runtime identity 的影響
#   3. 以 precondition_evidence 證明 families 36-43 仍為 sealed
#   4. 列出未變動的 scientific lock
# 維護提醒:
#   - 不得在 v2 尚未通過真實 provider validation 之前凍結本修訂。
#     凍一份「宣稱已驗證」而其實沒驗證過的記錄，比不凍更糟。
#   - 不得在 families 36-43 生成或讀取之後才凍結。
#   - v0.1.0 新增：草稿，對應 NOTE-052。
# 驗證方式:
#   - py -3.10 -m pcmef.cli corrective evidence-regression --cases 2
#   - py -3.10 -m pcmef.cli amendment freeze --spec configs/amendments/AMD-007.amendment.yaml
