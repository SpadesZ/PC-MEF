# PC-MEF Research System source maintenance contract
# 上下游: 由 `pcmef amendment freeze --spec` 讀取，寫出
#         freeze/amendments/AMD-006.amendment.json；被 pre-final corrective
#         run（freeze/runs/PFC-001）的 lineage 記錄引用。
# 檔案路徑: configs/amendments/AMD-006.amendment.yaml
# 產生時間: 2026-09-01 16:10 +08:00
# 版本: v0.1.0
# 功能說明: 記錄 Final E2 之前的更正性重凍結 —— 為什麼要開新的 formal run，
#           哪些 lock identity 被 supersede，哪些原樣延用，以及這件事發生在
#           families 36-43 仍未生成、未讀取之前。
# 模組定位: corrective lineage 的協定層記錄。它「不是」erratum ——
#           erratum 只更正 metadata 且硬性拒絕 parameter 變更，
#           而本次更正確實改變了 reliability anchors，因此必須走 amendment
#           加新 run，不得以勘誤層處理。
# 主要責任:
#   1. 記錄 reason A：NOTE-048 的 exclusion 未套入 reliability fitting
#   2. 記錄 reason B：formal_config 在正式 executor 實作前被凍結
#   3. 以 precondition_evidence 證明更正不是看到 Final E2 結果才做的
#   4. 以 invariants_preserved 列出未改動的一切
# 維護提醒:
#   - 不得在此放寬「locks are immutable」。原 freeze/ 的 22 個 lock 一個位元
#     都不動；更正以新的 run 目錄存在，兩者同時保留。
#   - 不得在 families 36-43 生成或讀取之後才凍結本修訂；
#     precondition_evidence 的兩個 NO 正是它唯一能證明的事。
#   - v0.1.0 新增：首版，對應 NOTE-051。
# 驗證方式:
#   - py -3.10 -m pcmef.cli amendment freeze --spec configs/amendments/AMD-006.amendment.yaml
#   - py -3.10 -m pcmef.cli amendment status
# ------------------------------------------------------------

amendment_id: AMD-006

title: >
  Open a pre-final corrective formal run: apply the NOTE-048 duplicate-identity
  exclusion to the reliability anchor fit, and re-freeze formal_config against a
  real Full PC-MEF executor. The original 22-lock lineage is retained unchanged
  as history; only the identities that actually changed are superseded.

supersedes: >
  Three lock identities from the original pre-final freeze lineage (freeze/,
  code_revision f5e6463b976f239849a3e0909d8c7e10a8452cb8):
  reliability_final (ebf4529a3d411eceaf425d6464f8f7f8f7242cf41859b11aee92dddda5371e1d),
  gate (1ff2d66745da30a73c3b977de1d34d94c67094ee4b70a49b653d492e931ac0d3) and
  formal_config (cefb453a80daa9766254dbfd549f5b7642b4be688561d5e8cb9dc80765742ed8).
  Those three files are NOT deleted and NOT rewritten; they remain in freeze/ as
  the historical lineage. The corrective run lives in freeze/runs/PFC-001/.
  Every other lock identity from that lineage is carried forward byte-identically
  and keeps its hash, which is the machine-checkable form of "not re-decided".

rationale: >
  Reason A -- the NOTE-048 exclusion was applied incompletely. gate.run_gate_validation
  called exclude_duplicate_identity_families() before anything else, so the
  temperature scaling, the severity ladder, the stress set and the gate threshold
  search all ran on the effective 31 families / 93 samples. But
  llm_real_validation._compute_cases() loaded the gate-validation manifest
  directly and never applied the exclusion, so the reliability anchors were fitted
  on the original 32 families / 96 samples -- including Empty f27, the family
  excluded precisely because it duplicates the ds_v2 Empty f15 physical scene the
  perception models were trained on. reliability_final.lock recorded that boundary
  honestly rather than hiding it, but recording a defect is not the same as fixing
  it. This is an implementation defect in applying an already-approved rule, not a
  new tuning decision: the algorithm, the feature schema, the anchor rule, the
  temperatures, the stress ladder, the severity rule, the CNN weights, the prompts
  and the LLM model are all unchanged. The only difference is the fitting pool.

  Reason B -- formal_config was frozen before an executor existed for the
  architecture it names. gate.lock names reliability_routing_v1 and
  selective_escalation_bridge_v1, but the only available runner was
  gate.run_formal_e2(), which routes through apply_gate() with a deterministic
  confidence-weighted stand-in and self-reports llm_arm_evaluated: false. A
  formal_config that certifies a decision path no runner implements cannot be the
  configuration a one-shot Final E2 executes under. The corrective run re-freezes
  formal_config only after the real executor exists, its tests pass, and the code
  revision is fixed.

  Neither reason depends on any Final E2 outcome. Families 36-43 have never been
  generated, rendered, read or inferred over, before or during this correction.

changed_contracts:
  reliability_anchor_fitting_pool:
    before: >
      Reliability anchors fitted on the clean gate-validation pool as loaded from
      the manifest: 32 families / 96 samples, NOT applying the NOTE-048
      duplicate-identity exclusion.
    after: >
      Reliability anchors fitted on the effective pool that NOTE-048 already
      approved and that every other fitting stage already used: 31 families /
      93 samples, hash bc2ec62a62b4f351f63ce1247e58c2ed4e07a436d7efdde355de1eb18fe3b7a2.
    why: >
      One rule, one pool. Having the gate fitted on 93 and the reliability
      anchors fitted on 96 means the pipeline disagrees with itself about which
      scenes it is allowed to have seen.
  formal_config_freeze_precondition:
    before: >
      formal_config could be frozen once every upstream lock existed.
    after: >
      formal_config may only be frozen after an executor implementing the
      decision path named in gate.lock exists and its tests pass, with the code
      revision fixed.
    why: >
      Otherwise the final certificate can name an architecture that nothing
      implements, which is what happened in the original lineage.
  formal_e2_executor:
    before: >
      gate.run_formal_e2(): apply_gate() routing plus confidence_weighted_arbiter,
      a deterministic stand-in; llm_arm_evaluated false; scenario-level bootstrap
      at seed 20260831.
    after: >
      experiments.e2_formal.run_formal_e2_full(): reliability_route over
      independent q_v/q_t, four real agents on escalation,
      arbitration_support_bridge_v1 then selective_escalation_bridge_v1, and the
      physical_scene_family cluster bootstrap at the seed frozen in
      statistics_config.lock. In formal mode a deterministic substitute is
      refused, retry exhaustion aborts the run, no case is dropped, and
      non-escalated cases make zero provider calls.
    why: >
      The frozen architecture and the executed architecture must be the same one.

precondition_evidence:
  final_e2_families_36_43_generated: false
  final_e2_families_36_43_read: false
  final_e2_families_36_43_inferred_over: false
  final_e2_report_exists: false
  heldout_access_count: 0
  calibration_access_count: 3
  note: >
    The correction is derived entirely from the gate-validation pool
    (families 20-35) and the already-seen deterministic-gate pilot
    (families 28-35). No Final E2 quantity exists to have been consulted: the
    families 36-43 sample directories do not exist, no manifest mentions them,
    and the absence is verified by a directory-name scan that opens no file.
  before_after_measured:
    reliability_anchors_before_96:
      q_vision_degraded_anchor: 0.30071915032810825
      q_vision_scale: 0.5111175604602404
      q_tof_degraded_anchor: 13.301544761468188
      q_tof_scale: 1.4450168379822053
    reliability_anchors_after_93:
      q_vision_degraded_anchor: 0.30038111405117257
      q_vision_scale: 0.6292412402504894
      q_tof_degraded_anchor: 13.499399129444784
      q_tof_scale: 1.4546864443216325
    route_counts_before_96: {escalated: 2, fusion: 77, trust_tof: 6, trust_vision: 8}
    route_counts_after_93: {escalated: 2, fusion: 76, trust_tof: 6, trust_vision: 9}
    cases_whose_route_changed: 1
    accepted_without_further_adjustment: true

invariants_preserved:
  gate_thresholds_unchanged: >
    Re-running the same gate search procedure on the effective-93 stress set
    reproduces the frozen thresholds exactly: q_vision 1.3157833714234424,
    q_tof 17.01321693530837, disagreement 0.48965981236738715, fusion weight 0.5.
    The gate search never used the reliability anchors, so the defect could not
    reach it. gate.lock is superseded only because it cross-references
    reliability_config_hash, not because any gate value moved.
  conflict_operational_unchanged: >
    delta is the disagreement threshold, which did not move, so
    conflict_operational keeps its identity
    6cdfab0fba51c5c37c82981bb35719a08244e52c55629741c15099ddd6e01c26 and is
    carried forward rather than re-decided.
  temperatures_unchanged: >
    temperature_vision 0.16915522430955235 and temperature_tof
    0.04978728827972712 were already fitted on the effective 93 by
    run_gate_validation and are not refitted here.
  severity_unchanged: >
    The severity ladder, the selection rule and the selected values
    (vision 2.0, tof 0.05) are untouched. No stress operator is added, removed
    or reparameterised.
  models_unchanged: >
    The ds_v2 Vision and ToF checkpoints, the preprocessing constants and the
    single training seed pair are byte-identical; nothing is retrained.
  agent_stack_unchanged: >
    validation_pool, agent_schema, llm_runtime, the four prompts, the three JSON
    schemas, the provider, the model and the inference firewall are all carried
    forward with unchanged hashes.
  sampling_and_statistics_unchanged: >
    e2_sample_size and statistics_config are carried forward unchanged: the
    reserved partition, the 384 condition rows, the 10000 replicates, the seed
    20260827, the family cluster unit and the class stratification are all
    exactly as first frozen.
  original_lineage_retained: >
    freeze/ keeps all 22 original lock files unmodified. The corrective run is a
    separate directory, so both lineages can be inspected side by side and the
    supersede is visible rather than implied by an absence.

authority: >
  Researcher decision under the project's "locks are immutable" red line and the
  NOTE-049 / NOTE-050 principle that pending contracts are aligned to the
  executed path. Because this correction changes a fitted parameter it is
  explicitly NOT eligible for the erratum layer, which forbids parameter,
  estimator, seed, scene and config changes; it therefore takes the amendment
  plus new-run route. Frozen while families 36-43 remain sealed, which is the
  only thing that makes "not chosen from the outcome" checkable.
