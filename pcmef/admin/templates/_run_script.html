<script>
// SSE 即時接收。約三十行原生 JavaScript —— §42 允許 minimal JS，
// 禁的是 React/Vue 這類大型前端依賴，而 EventSource 是瀏覽器原生 API。
(function () {
  var log = document.getElementById('log');
  var badge = document.getElementById('run-badge');
  var hint = document.getElementById('stream-hint');
  var finished = {{ 'true' if record.finished else 'false' }};

  if (finished) { hint.textContent = '已結束'; return; }

  var source = new EventSource('{{ url_for("console.stream", run_id=record.run_id) }}');

  source.onmessage = function (event) {
    var payload = JSON.parse(event.data);
    // 一律用 textContent 附加：伺服器輸出含檔名與錯誤字串，
    // 用 innerHTML 就是把它們當成 HTML 執行。
    log.appendChild(document.createTextNode(payload.line + '\n'));
    log.scrollTop = log.scrollHeight;
  };

  source.addEventListener('done', function (event) {
    var payload = JSON.parse(event.data);
    badge.textContent = payload.status;
    badge.className = 'badge ' + (payload.status === 'succeeded' ? 'ok' : 'bad');
    source.close();

    // 圖表由伺服器端算好後嵌在 HTML 裡，因此跑完必須重新載入才看得到。
    // 原本是請使用者自己按 F5 —— 但畫面在那一刻看起來已經「跑完了」，
    // 沒有任何東西提示還缺一步，於是圖等於不存在。
    // 只在成功時自動重載：失敗時本來就沒有圖，而把 log 捲掉會讓人
    // 看不到剛才那幾行錯誤訊息。
    if (payload.status === 'succeeded') {
      hint.textContent = '已結束（exit ' + payload.exit_code + '）· 正在載入圖表…';
      window.setTimeout(function () { window.location.reload(); }, 800);
    } else {
      hint.textContent = '已結束（exit ' + payload.exit_code + '）· 錯誤請見上方輸出';
    }
  });

  source.onerror = function () {
    hint.textContent = '串流中斷 —— 重新整理頁面即可續看';
    source.close();
  };
}());
</script>
